name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android >/dev/null
            echo "mode=secret" >> "$GITHUB_OUTPUT"
            echo "Restored persistent keystore from ANDROID_KEYSTORE_BASE64 secret."
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android >/dev/null
            echo "mode=repo" >> "$GITHUB_OUTPUT"
            echo "Decoded persistent keystore from repository debug.keystore.base64."
          else
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing. Generated a one-time fallback keystore — in-place APK upgrades will fail with a package conflict until ANDROID_KEYSTORE_BASE64 is configured."
          fi

      - name: Compute version metadata
        id: version
        run: |
          VERSION_CODE="${{ github.run_number }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: >
          gradle :app:assembleDebug
          -PappVersionCode=${{ steps.version.outputs.code }}
          -PappVersionName=${{ steps.version.outputs.name }}

      - name: Package versioned APK
        run: |
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_SRC" "dist/MachinaLog-${{ steps.version.outputs.tag }}.apk"
          if [ "${{ steps.keystore.outputs.mode }}" = "ephemeral" ]; then
            {
              echo "### Warning: Ephemeral Signing Key Used"
              echo "This build used a temporary fallback keystore because the \`ANDROID_KEYSTORE_BASE64\` repository secret is not set. Installing over a previous build will fail with a package conflict until you add \`ANDROID_KEYSTORE_BASE64\` in GitHub Settings → Secrets and variables → Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachinaLog-${{ steps.version.outputs.tag }}-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MachinaLog ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: ${{ steps.keystore.outputs.mode == 'ephemeral' && '⚠️ Built without ANDROID_KEYSTORE_BASE64 secret (one-time random signing key — requires uninstalling older versions once ANDROID_KEYSTORE_BASE64 is configured).' || 'Signed with persistent MachinaLog signing key (supports in-place APK upgrades).' }}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MachinaLog — PC Web Portal</title>
  <style>
    :root {
      --bg: #f3f6f9;
      --surface: #ffffff;
      --surface-alt: #eef2f6;
      --border: #d5dee8;
      --text: #102030;
      --muted: #52657a;
      --primary: #1b4965;
      --primary-fg: #ffffff;
      --primary-soft: #dcebf7;
      --ok: #137a47;
      --ok-soft: #daf4e6;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0d151e;
      --surface: #15212e;
      --surface-alt: #1b2a3a;
      --border: #2a3c4f;
      --text: #e6eef7;
      --muted: #93a7bd;
      --primary: #5aa9e6;
      --primary-fg: #071926;
      --primary-soft: #1a354b;
      --ok: #34d399;
      --ok-soft: #0d3326;
      --warn: #fbbf24;
      --warn-soft: #3b2a0b;
      --danger: #f87171;
      --danger-soft: #3d1417;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 10px; }
      .nav-list { flex-direction: row !important; }
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary); color: var(--primary-fg);
      display: grid; place-items: center;
      font-weight: 800; font-family: var(--mono);
    }
    .brand h1 { font-size: 16px; margin: 0; }
    .brand small { color: var(--muted); font-size: 11px; display: block; }
    .nav-list { display: flex; flex-direction: column; gap: 6px; }
    .nav-btn {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid transparent; background: transparent; color: var(--text);
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; text-align: left;
    }
    .nav-btn:hover { background: var(--surface-alt); }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); border-color: var(--border); }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .kpi-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; padding: 16px 22px 0;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .kpi .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .kpi .val { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .content { padding: 16px 22px 48px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .grid-split { display: grid; grid-template-columns: 360px 1fr; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .grid-split { grid-template-columns: 1fr; } }
    button, .btn {
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      padding: 8px 13px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    button:hover { background: var(--surface-alt); }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-primary:hover { filter: brightness(1.08); background: var(--primary); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-sm { padding: 5px 9px; font-size: 12px; }
    input, select, textarea {
      font-family: var(--sans); font-size: 13px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; width: 100%;
    }
    label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
    .pill {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700; font-family: var(--mono); letter-spacing: .02em;
      background: var(--surface-alt); color: var(--text);
    }
    .pill-primary { background: var(--primary-soft); color: var(--primary); }
    .pill-ok { background: var(--ok-soft); color: var(--ok); }
    .pill-warn { background: var(--warn-soft); color: var(--warn); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
    .chip {
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
    }
    .chip.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .subtabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .subtab {
      padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 700;
      border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); cursor: pointer;
    }
    .subtab.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .checkbox-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface-alt); max-height: 150px; overflow-y: auto;
    }
    .checkbox-pill {
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      color: var(--text); margin: 0; cursor: pointer; padding: 4px 6px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    }
    .checkbox-pill input { width: auto; margin: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; color: var(--muted); background: var(--surface-alt); }
    th.sortable-th { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable-th:hover { color: var(--primary); background: var(--primary-soft); }
    th.sortable-th .sort-ind { margin-left: 4px; font-size: 10px; opacity: 0.85; }
    tr.group-row td {
      background: var(--surface-alt); font-weight: 700; font-size: 13px;
      cursor: pointer; border-top: 2px solid var(--border); border-bottom: 1px solid var(--border);
    }
    tr.group-row:hover td { background: var(--primary-soft); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(6, 14, 24, 0.58);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .picker-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
    .picker-item {
      padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .picker-item:hover { background: var(--surface-alt); }
    .toast {
      position: fixed; right: 20px; bottom: 20px; background: var(--primary); color: var(--primary-fg);
      padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; z-index: 80;
      display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ML</div>
      <div>
        <h1>MachinaLog</h1>
        <small>PC LAN Web Portal</small>
      </div>
    </div>
    <div class="nav-list">
      <button class="nav-btn active" data-tab="tasks" onclick="switchTab('tasks')">Tasks &amp; To-Do <span class="pill" id="nav-badge-tasks">0</span></button>
      <button class="nav-btn" data-tab="machines" onclick="switchTab('machines')">Machines <span class="pill" id="nav-badge-machines">0</span></button>
      <button class="nav-btn" data-tab="warehouse" onclick="switchTab('warehouse')">Warehouse Parts <span class="pill" id="nav-badge-parts">0</span></button>
      <button class="nav-btn" data-tab="engineers" onclick="switchTab('engineers')">Engineers <span class="pill" id="nav-badge-engineers">0</span></button>
      <button class="nav-btn" data-tab="reports" onclick="switchTab('reports')">Reports &amp; Sync</button>
    </div>
    <div class="muted" style="margin-top:auto; padding: 6px;">
      Connected live to Android device Room DB over local Wi-Fi.
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <strong id="page-title">Tasks, To-Dos &amp; History</strong>
        <span class="pill pill-ok" style="margin-left:8px;">ONLINE</span>
      </div>
      <div class="row">
        <button class="btn-primary" onclick="openTaskModal()">+ New Task</button>
        <button onclick="refreshState()">Refresh</button>
        <button onclick="toggleTheme()">Theme</button>
      </div>
    </header>

    <section class="kpi-strip" id="top-kpi-strip"></section>

    <section class="content" id="view-root"></section>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <strong id="modal-title">Modal</strong>
      <button class="btn-sm" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<input type="file" id="quick-upload-xlsx" accept=".xlsx" style="display:none" onchange="handleQuickExcelUpload(this)" />
<div class="toast" id="toast"></div>

<script>
const appState = {
  data: null,
  tab: 'tasks',
  taskSubTab: 'active',
  pin: localStorage.getItem('machina_pin') || '',
  taskCadence: 'ALL',
  taskPriority: 'ALL',
  taskPic: 'ALL',
  taskGroupId: 'ALL',
  taskGroupBy: 'CUSTOM_GROUP',
  collapsedTaskGroups: {},
  taskOverdueOnly: false,
  taskSearch: '',
  todoRepeat: 'ALL',
  todoPriority: 'ALL',
  todoPic: 'ALL',
  todoGroupId: 'ALL',
  todoSearch: '',
  todoShowDone: false,
  todoPageSize: 25,
  todoPage: 0,
  historyOutcome: 'ALL',
  historyPriority: 'ALL',
  historyCadence: 'ALL',
  historyPic: 'ALL',
  historyGroupId: 'ALL',
  historySearch: '',
  machineStatus: 'ALL',
  machineSearch: '',
  selectedMachineId: null,
  partSearch: '',
  engineerSearch: '',
  colSorts: {
    tasks: { key: 'deadline', dir: 'ASC' },
    todos: { key: 'trigger', dir: 'ASC' },
    history: { key: 'recorded', dir: 'DESC' },
    warehouse: { key: 'partCode', dir: 'ASC' },
    engineers: { key: 'name', dir: 'ASC' }
  },
  reportFilter: { machineId: '', groupId: '', pic: '', cadence: '', outcome: '', start: '', end: '' },
  draftParts: [],
  updateStatusText: '',
  latestReleaseInfo: null
};

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('machina_theme', next);
}
if (localStorage.getItem('machina_theme') === 'dark' ||
    (!localStorage.getItem('machina_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
}

async function apiFetch(path, options = {}) {
  const headers = Object.assign({}, options.headers || {});
  if (appState.pin) headers['X-Machina-Pin'] = appState.pin;
  const resp = await fetch(path, Object.assign({}, options, { headers }));
  if (resp.status === 401) {
    promptPinModal();
    throw new Error('PIN required');
  }
  return resp;
}

async function apiJson(path, method = 'GET', bodyObj = null) {
  const opts = { method, headers: {} };
  if (bodyObj !== null) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(bodyObj);
  }
  const resp = await apiFetch(path, opts);
  const json = await resp.json();
  if (!resp.ok || json.ok === false) throw new Error(json.message || 'Request failed');
  return json;
}

function promptPinModal() {
  openModal('Enter Device PIN', `
    <p class="muted">This Android device requires a PIN to access MachinaLog over Wi-Fi.</p>
    <div><label>PIN Code</label><input id="pin-input" type="password" placeholder="Enter 4-digit PIN" /></div>
  `, `<button class="btn-primary" onclick="submitPin()">Unlock</button>`);
}

function submitPin() {
  appState.pin = document.getElementById('pin-input').value.trim();
  localStorage.setItem('machina_pin', appState.pin);
  closeModal();
  refreshState();
}

async function refreshState() {
  try {
    const ping = await (await fetch('/api/ping', { headers: appState.pin ? { 'X-Machina-Pin': appState.pin } : {} })).json();
    if (ping.pinRequired && !ping.authorized) {
      promptPinModal();
      return;
    }
    const data = await apiJson('/api/state');
    appState.data = data;
    if (!appState.selectedMachineId && data.machines.length) {
      appState.selectedMachineId = data.machines[0].id;
    }
    updateKpis();
    renderTab();
  } catch (e) {
    if (e.message !== 'PIN required') showToast('Error: ' + e.message);
  }
}

function buildTodoFeedList(d) {
  const mMap = byIdMap(d.machines);
  const standalone = (d.todos || []).map(td => ({
    kind: 'TODO',
    id: td.id,
    title: td.title || '',
    notes: td.notes || '',
    repeatLabel: td.repeatRule || 'ONCE',
    priority: td.priority || 'NORMAL',
    machineId: td.machineId || null,
    groupId: td.groupId || (td.machineId && mMap[td.machineId] ? mMap[td.machineId].groupId : null),
    personInCharge: td.personInCharge || '',
    assistantEngineers: '',
    createdAtMillis: td.createdAtMillis || td.dueAtMillis || 0,
    triggerAtMillis: td.dueAtMillis || 0,
    dueAtMillis: td.dueAtMillis || 0,
    isCompleted: Boolean(td.isCompleted),
    completedAtMillis: td.completedAtMillis || null,
    reminderEnabled: Boolean(td.reminderEnabled),
    raw: td
  }));
  const linked = (d.tasks || []).filter(t => t.reminderEnabled).map(t => {
    const leadHrs = Math.max(1, Number(t.reminderLeadHours) || 24);
    const triggerAt = (t.deadlineMillis || 0) - leadHrs * 3600 * 1000;
    return {
      kind: 'TASK',
      id: t.id,
      title: t.title || '',
      notes: t.description || '',
      repeatLabel: t.cadence || 'ONCE',
      priority: t.priority || 'NORMAL',
      machineId: t.machineId,
      groupId: t.groupId || (mMap[t.machineId] ? mMap[t.machineId].groupId : null),
      personInCharge: t.personInCharge || '',
      assistantEngineers: t.assistantEngineers || '',
      createdAtMillis: t.createdAtMillis || 0,
      triggerAtMillis: triggerAt,
      dueAtMillis: t.deadlineMillis || 0,
      isCompleted: false,
      completedAtMillis: null,
      reminderEnabled: true,
      raw: t
    };
  });
  return standalone.concat(linked);
}

function renderTopKpis() {
  const strip = document.getElementById('top-kpi-strip');
  const d = appState.data;
  if (!strip || !d) return;
  const now = Date.now();
  let cards = [];

  if (appState.tab === 'tasks' && appState.taskSubTab === 'active') {
    const total = d.tasks.length;
    const overdue = d.tasks.filter(t => t.deadlineMillis < now).length;
    const openOnSchedule = d.tasks.filter(t => t.deadlineMillis >= now).length;
    const approaching = d.tasks.filter(t => {
      if (t.deadlineMillis < now) return false;
      const leadMs = Math.max(1, Number(t.reminderLeadHours) || 24) * 3600 * 1000;
      return (t.deadlineMillis - now <= 24 * 3600 * 1000) || (t.reminderEnabled && (t.deadlineMillis - leadMs <= now));
    }).length;
    cards = [
      { lbl: 'Total Tasks', val: total, color: '' },
      { lbl: 'Open Tasks', val: openOnSchedule, color: 'var(--primary)' },
      { lbl: 'Overdue Tasks', val: overdue, color: overdue > 0 ? 'var(--danger)' : 'var(--ok)' },
      { lbl: 'Approaching Deadline', val: approaching, color: approaching > 0 ? 'var(--warn)' : '' }
    ];
  } else if (appState.tab === 'tasks' && appState.taskSubTab === 'todos') {
    const feed = buildTodoFeedList(d);
    const openList = feed.filter(x => !x.isCompleted);
    const overdue = openList.filter(x => x.dueAtMillis < now).length;
    const openOnSchedule = openList.filter(x => x.dueAtMillis >= now).length;
    const approaching = openList.filter(x => x.dueAtMillis >= now && (x.triggerAtMillis <= now || (x.dueAtMillis - now <= 24 * 3600 * 1000))).length;
    cards = [
      { lbl: 'Total To-Dos', val: feed.length, color: '' },
      { lbl: 'Open To-Dos', val: openOnSchedule, color: 'var(--primary)' },
      { lbl: 'Overdue To-Dos', val: overdue, color: overdue > 0 ? 'var(--danger)' : 'var(--ok)' },
      { lbl: 'Approaching Deadline', val: approaching, color: approaching > 0 ? 'var(--warn)' : '' }
    ];
  } else if (appState.tab === 'tasks' && appState.taskSubTab === 'history') {
    const total = d.serviceLogs.length;
    const done = d.serviceLogs.filter(l => l.outcome === 'DONE').length;
    const rejected = d.serviceLogs.filter(l => l.outcome === 'REJECTED').length;
    const totalMins = d.serviceLogs.reduce((acc, l) => acc + (Number(l.serviceDurationMinutes) || 0), 0);
    cards = [
      { lbl: 'History Records', val: total, color: '' },
      { lbl: 'Completed (Done)', val: done, color: 'var(--ok)' },
      { lbl: 'Rejected', val: rejected, color: rejected > 0 ? 'var(--danger)' : '' },
      { lbl: 'Service Hours Logged', val: (Math.round((totalMins / 60) * 10) / 10) + 'h', color: 'var(--primary)' }
    ];
  } else if (appState.tab === 'machines') {
    const operational = d.machines.filter(m => m.status === 'OPERATIONAL').length;
    const maintDue = d.machines.filter(m => m.status === 'MAINTENANCE_DUE').length;
    const malfunction = d.machines.filter(m => m.status === 'MALFUNCTION').length;
    cards = [
      { lbl: 'Total Machines', val: d.machines.length, color: '' },
      { lbl: 'Operational', val: operational, color: 'var(--ok)' },
      { lbl: 'Maintenance Due', val: maintDue, color: maintDue > 0 ? 'var(--warn)' : '' },
      { lbl: 'Malfunction', val: malfunction, color: malfunction > 0 ? 'var(--danger)' : '' }
    ];
  } else if (appState.tab === 'warehouse') {
    const usageCount = d.serviceLogs.reduce((acc, l) => acc + ((l.parts || []).length), 0);
    cards = [
      { lbl: 'Warehouse Spare Parts', val: d.warehouseParts.length, color: 'var(--primary)' },
      { lbl: 'Historical Part Uses', val: usageCount, color: '' }
    ];
  } else if (appState.tab === 'engineers') {
    const engs = d.engineers || [];
    const done = d.serviceLogs.filter(l => l.outcome === 'DONE').length;
    cards = [
      { lbl: 'Registered Engineers', val: engs.length, color: 'var(--primary)' },
      { lbl: 'Active Task Assignments', val: d.tasks.length, color: 'var(--warn)' },
      { lbl: 'Historical Jobs Done', val: done, color: 'var(--ok)' }
    ];
  } else {
    cards = [
      { lbl: 'Active Tasks', val: d.tasks.length, color: '' },
      { lbl: 'History Reports', val: d.serviceLogs.length, color: 'var(--ok)' },
      { lbl: 'Custom Groups', val: d.groups.length, color: 'var(--primary)' },
      { lbl: 'App Version', val: 'v' + (d.appVersionName || '1.0'), color: '' }
    ];
  }

  strip.innerHTML = cards.map(c =>
    `<div class="kpi"><div class="lbl">${esc(c.lbl)}</div><div class="val" ${c.color ? `style="color:${c.color}"` : ''}>${esc(c.val)}</div></div>`
  ).join('');
}

function updateKpis() {
  const d = appState.data;
  if (!d) return;
  const now = Date.now();
  const overdueTasks = d.tasks.filter(t => t.deadlineMillis < now).length;
  const overdueTodos = d.todos.filter(td => !td.isCompleted && td.dueAtMillis < now).length;
  const engineersCount = (d.engineers || []).length;

  document.getElementById('nav-badge-tasks').textContent = (overdueTasks + overdueTodos) || d.tasks.length;
  document.getElementById('nav-badge-machines').textContent = d.machines.length;
  document.getElementById('nav-badge-parts').textContent = d.warehouseParts.length;
  document.getElementById('nav-badge-engineers').textContent = engineersCount;
  renderTopKpis();
}

function switchTab(tab) {
  appState.tab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const titles = {
    tasks: 'Tasks, To-Dos & History',
    machines: 'Machines & Fleet History',
    warehouse: 'Warehouse Spare Parts Catalog',
    engineers: 'Maintenance Engineers',
    reports: 'Reports, Excel/Backup Sync & Groups'
  };
  document.getElementById('page-title').textContent = titles[tab] || 'MachinaLog';
  renderTab();
}

function fmtDate(ms) {
  if (!ms) return '-';
  return new Date(ms).toLocaleString([], { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function toInputDateTime(ms) {
  const dt = new Date(ms || Date.now());
  const pad = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

function formatLeadTime(hours) {
  const h = Math.max(1, Number(hours) || 24);
  if (h >= 24 && h % 24 === 0) {
    const days = h / 24;
    return days === 1 ? '1 day' : `${days} days`;
  }
  return h === 1 ? '1 hour' : `${h} hours`;
}

function parseEngineerList(raw) {
  if (!raw) return [];
  return String(raw).split(',').map(s => s.trim()).filter(Boolean);
}

function byIdMap(list) {
  const m = {};
  (list || []).forEach(x => m[x.id] = x);
  return m;
}

function statusPillHtml(status) {
  if (status === 'MALFUNCTION') return `<span class="pill pill-danger">MALFUNCTION</span>`;
  if (status === 'MAINTENANCE_DUE') return `<span class="pill pill-warn">MAINT. DUE</span>`;
  return `<span class="pill pill-ok">OPERATIONAL</span>`;
}

function outcomePillHtml(outcome) {
  if (outcome === 'REJECTED') return `<span class="pill pill-danger">REJECTED</span>`;
  return `<span class="pill pill-ok">DONE</span>`;
}

function priorityPillHtml(priority) {
  const p = String(priority || 'NORMAL').toUpperCase();
  if (p === 'URGENT') return `<span class="pill pill-danger">URGENT</span>`;
  if (p === 'HIGH') return `<span class="pill pill-warn">HIGH</span>`;
  return `<span class="pill">NORMAL</span>`;
}

function buildEngineerSelectHtml(idAttr, engineers, preferredName, onchangeAttr = '') {
  if (!engineers || engineers.length === 0) {
    return `<select id="${idAttr}" ${onchangeAttr}><option value="">No registered engineers — add one in Engineers tab</option></select>`;
  }
  const match = engineers.find(e => e.name.toLowerCase() === String(preferredName || '').trim().toLowerCase());
  const selectedName = match ? match.name : engineers[0].name;
  return `<select id="${idAttr}" ${onchangeAttr}>${engineers.map(e =>
    `<option value="${esc(e.name)}" ${e.name === selectedName ? 'selected' : ''}>${esc(e.name)}${e.employeeCode ? ' (' + esc(e.employeeCode) + ')' : ''}</option>`
  ).join('')}</select>`;
}

function renderAssistantCheckboxesHtml(prefix, engineers, excludePic, selectedNames) {
  const candidates = (engineers || []).filter(e => e.name.toLowerCase() !== String(excludePic || '').trim().toLowerCase());
  if (candidates.length === 0) {
    return `<div class="muted">No additional engineers available. Add more crew in the Engineers tab if needed.</div>`;
  }
  const selectedLower = new Set((selectedNames || []).map(s => s.toLowerCase()));
  return candidates.map(e => `
    <label class="checkbox-pill">
      <input type="checkbox" value="${esc(e.name)}" ${selectedLower.has(e.name.toLowerCase()) ? 'checked' : ''} />
      <span>${esc(e.name)}</span>
    </label>
  `).join('');
}

function syncAssistantBox(prefix) {
  const picEl = document.getElementById(`${prefix}-pic`);
  const boxEl = document.getElementById(`${prefix}-assistants-box`);
  if (!picEl || !boxEl) return;
  const currentlyChecked = Array.from(boxEl.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
  boxEl.innerHTML = renderAssistantCheckboxesHtml(prefix, appState.data.engineers || [], picEl.value, currentlyChecked);
}

function getCheckedAssistants(prefix) {
  const pic = document.getElementById(`${prefix}-pic`)?.value || '';
  const boxEl = document.getElementById(`${prefix}-assistants-box`);
  if (!boxEl) return [];
  return Array.from(boxEl.querySelectorAll('input[type="checkbox"]:checked'))
    .map(cb => cb.value)
    .filter(name => name.toLowerCase() !== pic.toLowerCase());
}

function toggleColSort(section, key) {
  const cur = appState.colSorts[section] || { key, dir: 'ASC' };
  if (cur.key === key) {
    cur.dir = cur.dir === 'ASC' ? 'DESC' : 'ASC';
  } else {
    cur.key = key;
    cur.dir = (key === 'recorded' || key === 'created') ? 'DESC' : 'ASC';
  }
  appState.colSorts[section] = cur;
  renderTab();
}

function sortableTh(section, key, label) {
  const cur = appState.colSorts[section];
  const active = cur && cur.key === key;
  const ind = active ? (cur.dir === 'ASC' ? '▲' : '▼') : '⇅';
  return `<th class="sortable-th" title="Click to sort by ${esc(label)}" onclick="toggleColSort('${section}','${key}')">${esc(label)}<span class="sort-ind">${ind}</span></th>`;
}

function priorityRank(p) {
  const u = String(p || 'NORMAL').toUpperCase();
  if (u === 'URGENT') return 3;
  if (u === 'HIGH') return 2;
  return 1;
}

function cmpValues(a, b, dir) {
  let res = 0;
  if (typeof a === 'number' && typeof b === 'number') {
    res = a - b;
  } else {
    res = String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base', numeric: true });
  }
  return dir === 'DESC' ? -res : res;
}

function renderTab() {
  const d = appState.data;
  if (!d) return;
  renderTopKpis();
  const root = document.getElementById('view-root');
  if (appState.tab === 'tasks') renderTasks(root, d);
  else if (appState.tab === 'machines') renderMachines(root, d);
  else if (appState.tab === 'warehouse') renderWarehouse(root, d);
  else if (appState.tab === 'engineers') renderEngineers(root, d);
  else if (appState.tab === 'reports') renderReports(root, d);
}

// --- 1. UNIFIED TASKS, TO-DO REMINDERS & HISTORY ---
function renderTasks(root, d) {
  const openTodosCount = (d.todos || []).filter(td => !td.isCompleted).length + (d.tasks || []).filter(t => t.reminderEnabled).length;
  const subtabsHtml = `
    <div class="subtabs">
      <button class="subtab ${appState.taskSubTab==='active'?'active':''}" onclick="appState.taskSubTab='active'; renderTab()">Active Tasks (${d.tasks.length})</button>
      <button class="subtab ${appState.taskSubTab==='todos'?'active':''}" onclick="appState.taskSubTab='todos'; renderTab()">To-Do Reminders (${openTodosCount})</button>
      <button class="subtab ${appState.taskSubTab==='history'?'active':''}" onclick="appState.taskSubTab='history'; renderTab()">Task History (${d.serviceLogs.length})</button>
    </div>`;

  if (appState.taskSubTab === 'todos') {
    root.innerHTML = `<div class="card">${subtabsHtml}${renderTodoSubTabHtml(d)}</div>`;
    return;
  }
  if (appState.taskSubTab === 'history') {
    root.innerHTML = `<div class="card">${subtabsHtml}${renderHistorySubTabHtml(d)}</div>`;
    return;
  }

  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const now = Date.now();
  const q = appState.taskSearch.trim().toLowerCase();
  const picNames = [...new Set((d.engineers || []).map(e => e.name).concat(d.tasks.map(t => t.personInCharge)).filter(Boolean))].sort();
  const tSort = appState.colSorts.tasks || { key: 'deadline', dir: 'ASC' };

  const filtered = d.tasks.filter(t => {
    const m = mMap[t.machineId];
    const effGroupId = t.groupId || m?.groupId || null;
    if (appState.taskCadence !== 'ALL' && t.cadence !== appState.taskCadence) return false;
    if (appState.taskPriority !== 'ALL' && (t.priority || 'NORMAL') !== appState.taskPriority) return false;
    if (appState.taskGroupId !== 'ALL' && String(effGroupId || '') !== String(appState.taskGroupId)) return false;
    if (appState.taskPic !== 'ALL') {
      const picLower = appState.taskPic.toLowerCase();
      const isPic = (t.personInCharge || '').toLowerCase() === picLower;
      const isAst = parseEngineerList(t.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (appState.taskOverdueOnly && t.deadlineMillis >= now) return false;
    if (q) {
      const hay = `${t.title} ${t.description} ${t.priority || 'NORMAL'} ${t.personInCharge} ${t.assistantEngineers || ''} ${m?.assetCode || ''} ${m?.name || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    const mA = mMap[a.machineId];
    const mB = mMap[b.machineId];
    switch (tSort.key) {
      case 'priority': {
        const pr = cmpValues(priorityRank(a.priority), priorityRank(b.priority), tSort.dir);
        return pr !== 0 ? pr : String(a.cadence).localeCompare(String(b.cadence));
      }
      case 'machine':
        return cmpValues(`${mA?.assetCode || ''} ${mA?.name || ''}`, `${mB?.assetCode || ''} ${mB?.name || ''}`, tSort.dir);
      case 'title':
        return cmpValues(a.title, b.title, tSort.dir);
      case 'created':
        return cmpValues(a.createdAtMillis || 0, b.createdAtMillis || 0, tSort.dir);
      case 'pic':
        return cmpValues(a.personInCharge, b.personInCharge, tSort.dir);
      case 'est':
        return cmpValues(Number(a.estimatedMinutes) || 0, Number(b.estimatedMinutes) || 0, tSort.dir);
      case 'deadline':
      default:
        return cmpValues(a.deadlineMillis || 0, b.deadlineMillis || 0, tSort.dir);
    }
  });

  // Group rows based on appState.taskGroupBy
  const sections = [];
  if (appState.taskGroupBy === 'NONE') {
    sections.push({ title: 'All Tasks', tasks: filtered });
  } else {
    const groupBucket = new Map();
    filtered.forEach(t => {
      const m = mMap[t.machineId];
      let gTitle = 'Ungrouped';
      if (appState.taskGroupBy === 'CADENCE') gTitle = `${t.cadence} Maintenance`;
      else if (appState.taskGroupBy === 'MACHINE') gTitle = m ? `${m.assetCode} · ${m.name}` : 'Unknown Machine';
      else if (appState.taskGroupBy === 'PIC') gTitle = t.personInCharge || 'Unassigned';
      else {
        const effGid = t.groupId || m?.groupId;
        gTitle = effGid && gMap[effGid] ? gMap[effGid].name : 'Ungrouped';
      }
      if (!groupBucket.has(gTitle)) groupBucket.set(gTitle, []);
      groupBucket.get(gTitle).push(t);
    });
    groupBucket.forEach((tasks, title) => sections.push({ title, tasks }));
  }

  const renderTaskRow = (t) => {
    const m = mMap[t.machineId];
    const g = gMap[t.groupId || m?.groupId];
    const overdue = t.deadlineMillis < now;
    return `<tr>
      <td>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          ${priorityPillHtml(t.priority)}
          <span class="pill pill-primary">${esc(t.cadence)}</span>
        </div>
        ${t.cadence!=='ONCE' ? `<div class="muted" style="margin-top:3px;">Auto-repeats</div>`:''}
        ${g ? `<div class="muted" style="margin-top:4px;">${esc(g.name)}</div>` : ''}
      </td>
      <td><strong>${esc(m?.assetCode || '-')}</strong><div class="muted">${esc(m?.name || '')}</div></td>
      <td><strong>${esc(t.title)}</strong><div class="muted">${esc(t.description)}</div></td>
      <td><div class="muted">${fmtDate(t.createdAtMillis)}</div></td>
      <td>
        <span class="pill ${overdue ? 'pill-danger' : 'pill-ok'}">${overdue ? 'OVERDUE' : 'ON SCHEDULE'}</span>
        <div class="muted">${fmtDate(t.deadlineMillis)}</div>
        <div class="muted">${t.reminderEnabled ? `Remind ${esc(formatLeadTime(t.reminderLeadHours))} before` : 'Reminder off'}</div>
      </td>
      <td>
        <strong>${esc(t.personInCharge)}</strong>
        ${t.assistantEngineers ? `<div class="muted">+ ${esc(t.assistantEngineers)}</div>` : ''}
      </td>
      <td>${t.estimatedMinutes}m</td>
      <td>
        <div class="row">
          <button class="btn-primary btn-sm" onclick="openCompleteTaskModal(${t.id})">Complete</button>
          <button class="btn-sm btn-danger" onclick="openRejectTaskModal(${t.id})">Reject</button>
          <button class="btn-sm" onclick="openTaskModal(${t.id})">Edit</button>
          <button class="btn-sm btn-danger" onclick="deleteTask(${t.id})">Del</button>
        </div>
      </td>
    </tr>`;
  };

  let tbodyHtml = '';
  if (filtered.length === 0) {
    tbodyHtml = `<tr><td colspan="8" class="muted">No active tasks match the current filter.</td></tr>`;
  } else {
    sections.forEach((sec, idx) => {
      if (appState.taskGroupBy !== 'NONE') {
        const collapsed = Boolean(appState.collapsedTaskGroups[sec.title]);
        const secOverdue = sec.tasks.filter(t => t.deadlineMillis < now).length;
        const encodedKey = encodeURIComponent(sec.title);
        tbodyHtml += `<tr class="group-row" onclick="toggleTaskGroupCollapse('${encodedKey}')">
          <td colspan="8">
            <div class="between">
              <span>${collapsed ? '▶' : '▼'} ${esc(sec.title)}</span>
              <div class="row">
                ${secOverdue > 0 ? `<span class="pill pill-danger">${secOverdue} OVERDUE</span>` : ''}
                <span class="pill">${sec.tasks.length}</span>
              </div>
            </div>
          </td>
        </tr>`;
        if (!collapsed) {
          tbodyHtml += sec.tasks.map(renderTaskRow).join('');
        }
      } else {
        tbodyHtml += sec.tasks.map(renderTaskRow).join('');
      }
    });
  }

  root.innerHTML = `
    <div class="card">
      ${subtabsHtml}
      <div class="between" style="gap:8px;">
        <div class="row" style="flex:1; min-width:240px;">
          <input style="max-width:240px;" placeholder="Search tasks, machine, PIC..." value="${esc(appState.taskSearch)}" oninput="appState.taskSearch=this.value; renderTab()" />
          <select style="width:auto;" onchange="appState.taskGroupBy=this.value; renderTab()">
            <option value="CUSTOM_GROUP" ${appState.taskGroupBy==='CUSTOM_GROUP'?'selected':''}>Group: Custom Group</option>
            <option value="CADENCE" ${appState.taskGroupBy==='CADENCE'?'selected':''}>Group: Cadence</option>
            <option value="MACHINE" ${appState.taskGroupBy==='MACHINE'?'selected':''}>Group: Machine</option>
            <option value="PIC" ${appState.taskGroupBy==='PIC'?'selected':''}>Group: Engineer</option>
            <option value="NONE" ${appState.taskGroupBy==='NONE'?'selected':''}>Flat List</option>
          </select>
          <select style="width:auto;" onchange="appState.taskPriority=this.value; renderTab()">
            <option value="ALL" ${appState.taskPriority==='ALL'?'selected':''}>All Priorities</option>
            <option value="URGENT" ${appState.taskPriority==='URGENT'?'selected':''}>URGENT</option>
            <option value="HIGH" ${appState.taskPriority==='HIGH'?'selected':''}>HIGH</option>
            <option value="NORMAL" ${appState.taskPriority==='NORMAL'?'selected':''}>NORMAL</option>
          </select>
          <select style="width:auto;" onchange="appState.taskPic=this.value; renderTab()">
            <option value="ALL" ${appState.taskPic==='ALL'?'selected':''}>All Engineers</option>
            ${picNames.map(p => `<option value="${esc(p)}" ${appState.taskPic===p?'selected':''}>${esc(p)}</option>`).join('')}
          </select>
          <select style="width:auto;" onchange="appState.taskGroupId=this.value; renderTab()">
            <option value="ALL" ${appState.taskGroupId==='ALL'?'selected':''}>All Groups</option>
            ${d.groups.map(g => `<option value="${g.id}" ${String(appState.taskGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
          </select>
          <label style="display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer;">
            <input type="checkbox" style="width:auto;" ${appState.taskOverdueOnly ? 'checked' : ''} onchange="appState.taskOverdueOnly=this.checked; renderTab()" />
            Overdue Only
          </label>
        </div>
        <div class="row">
          <button class="btn-sm" onclick="triggerQuickExcelImport()">Import Excel (.xlsx)</button>
          <button class="btn-primary" onclick="openTaskModal()">+ New Task</button>
        </div>
      </div>
      <div class="chip-row">
        ${['ALL','ONCE','DAILY','WEEKLY','MONTHLY','YEARLY'].map(c => `<button class="chip ${appState.taskCadence===c?'active':''}" onclick="appState.taskCadence='${c}'; renderTab()">${c}</button>`).join('')}
      </div>
      <table>
        <thead>
          <tr>
            ${sortableTh('tasks', 'priority', 'Priority & Cadence')}
            ${sortableTh('tasks', 'machine', 'Machine')}
            ${sortableTh('tasks', 'title', 'Task')}
            ${sortableTh('tasks', 'created', 'Created')}
            ${sortableTh('tasks', 'deadline', 'Deadline & Reminder')}
            ${sortableTh('tasks', 'pic', 'Engineers')}
            ${sortableTh('tasks', 'est', 'Est.')}
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>${tbodyHtml}</tbody>
      </table>
    </div>`;
}

function toggleTaskGroupCollapse(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  appState.collapsedTaskGroups[title] = !appState.collapsedTaskGroups[title];
  renderTab();
}

function renderTodoSubTabHtml(d) {
  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const now = Date.now();
  const completedCount = (d.todos || []).filter(td => td.isCompleted).length;
  const feed = buildTodoFeedList(d);
  const picNames = [...new Set((d.engineers || []).map(e => e.name).concat(feed.map(f => f.personInCharge)).filter(Boolean))].sort();
  const q = appState.todoSearch.trim().toLowerCase();
  const tdSort = appState.colSorts.todos || { key: 'trigger', dir: 'ASC' };

  const filtered = feed.filter(item => {
    if (!appState.todoShowDone && item.isCompleted) return false;
    if (appState.todoRepeat !== 'ALL' && item.repeatLabel !== appState.todoRepeat) return false;
    if (appState.todoPriority !== 'ALL' && item.priority !== appState.todoPriority) return false;
    if (appState.todoGroupId !== 'ALL' && String(item.groupId || '') !== String(appState.todoGroupId)) return false;
    if (appState.todoPic !== 'ALL') {
      const picLower = appState.todoPic.toLowerCase();
      const isPic = item.personInCharge.toLowerCase() === picLower;
      const isAst = parseEngineerList(item.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (q) {
      const m = item.machineId ? mMap[item.machineId] : null;
      const hay = `${item.title} ${item.notes} ${item.personInCharge} ${item.assistantEngineers} ${m?.assetCode || ''} ${m?.name || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
    switch (tdSort.key) {
      case 'title': return cmpValues(a.title, b.title, tdSort.dir);
      case 'repeat': return cmpValues(a.repeatLabel, b.repeatLabel, tdSort.dir);
      case 'priority': return cmpValues(priorityRank(a.priority), priorityRank(b.priority), tdSort.dir);
      case 'created': return cmpValues(a.createdAtMillis, b.createdAtMillis, tdSort.dir);
      case 'pic': return cmpValues(a.personInCharge, b.personInCharge, tdSort.dir);
      case 'trigger':
      default: {
        const tA = a.isCompleted ? (a.completedAtMillis || a.dueAtMillis) : a.triggerAtMillis;
        const tB = b.isCompleted ? (b.completedAtMillis || b.dueAtMillis) : b.triggerAtMillis;
        return cmpValues(tA, tB, tdSort.dir);
      }
    }
  });

  const pageSize = [25, 50, 100].includes(appState.todoPageSize) ? appState.todoPageSize : 25;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const safePage = Math.max(0, Math.min(appState.todoPage, totalPages - 1));
  appState.todoPage = safePage;
  const startIdx = safePage * pageSize;
  const paged = filtered.slice(startIdx, startIdx + pageSize);

  return `
    <div class="between" style="gap:8px;">
      <div class="row" style="flex:1; min-width:240px;">
        <input style="max-width:240px;" placeholder="Search reminders, tasks, machine, PIC..." value="${esc(appState.todoSearch)}" oninput="appState.todoSearch=this.value; appState.todoPage=0; renderTab()" />
        <select style="width:auto;" onchange="appState.todoPriority=this.value; appState.todoPage=0; renderTab()">
          <option value="ALL" ${appState.todoPriority==='ALL'?'selected':''}>All Priorities</option>
          <option value="URGENT" ${appState.todoPriority==='URGENT'?'selected':''}>URGENT</option>
          <option value="HIGH" ${appState.todoPriority==='HIGH'?'selected':''}>HIGH</option>
          <option value="NORMAL" ${appState.todoPriority==='NORMAL'?'selected':''}>NORMAL</option>
        </select>
        <select style="width:auto;" onchange="appState.todoPic=this.value; appState.todoPage=0; renderTab()">
          <option value="ALL" ${appState.todoPic==='ALL'?'selected':''}>All Engineers</option>
          ${picNames.map(p => `<option value="${esc(p)}" ${appState.todoPic===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <select style="width:auto;" onchange="appState.todoGroupId=this.value; appState.todoPage=0; renderTab()">
          <option value="ALL" ${appState.todoGroupId==='ALL'?'selected':''}>All Groups</option>
          ${d.groups.map(g => `<option value="${g.id}" ${String(appState.todoGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
        </select>
        <label style="display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer;">
          <input type="checkbox" style="width:auto;" ${appState.todoShowDone?'checked':''} onchange="appState.todoShowDone=this.checked; appState.todoPage=0; renderTab()" /> Show Completed (${completedCount})
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;margin:0;">
          <span>Per page:</span>
          <select style="width:auto;" onchange="appState.todoPageSize=Number(this.value); appState.todoPage=0; renderTab()">
            ${[25, 50, 100].map(sz => `<option value="${sz}" ${pageSize===sz?'selected':''}>${sz}</option>`).join('')}
          </select>
        </label>
      </div>
      <button class="btn-primary" onclick="openTodoModal()">+ New Reminder</button>
    </div>
    <div class="chip-row">

function renderHistorySubTabHtml(d) {
  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const picNames = [...new Set((d.engineers || []).map(e => e.name).concat(d.serviceLogs.map(l => l.personInCharge)).filter(Boolean))].sort();
  const q = appState.historySearch.trim().toLowerCase();
  const hSort = appState.colSorts.history || { key: 'recorded', dir: 'DESC' };

  const filtered = d.serviceLogs.filter(l => {
    const m = mMap[l.machineId];
    const effGroupId = l.groupId || m?.groupId || null;
    if (appState.historyOutcome !== 'ALL' && l.outcome !== appState.historyOutcome) return false;
    if (appState.historyPriority !== 'ALL' && (l.prioritySnapshot || '') !== appState.historyPriority) return false;
    if (appState.historyCadence !== 'ALL' && (l.cadenceSnapshot || '') !== appState.historyCadence) return false;
    if (appState.historyGroupId !== 'ALL' && String(effGroupId || '') !== String(appState.historyGroupId)) return false;
    if (appState.historyPic !== 'ALL') {
      const picLower = appState.historyPic.toLowerCase();
      const isPic = (l.personInCharge || '').toLowerCase() === picLower;
      const isAst = parseEngineerList(l.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (q) {
      const partsHay = (l.parts || []).map(p => `${p.partCode} ${p.partName} ${p.partDescription}`).join(' ');
      const hay = `${l.summaryTitle} ${l.malfunctionDetails} ${l.rejectionReason} ${l.personInCharge} ${l.assistantEngineers || ''} ${m?.assetCode || ''} ${m?.name || ''} ${partsHay}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    const mA = mMap[a.machineId];
    const mB = mMap[b.machineId];
    switch (hSort.key) {
      case 'outcome': return cmpValues(a.outcome, b.outcome, hSort.dir);
      case 'priority': return cmpValues(priorityRank(a.prioritySnapshot), priorityRank(b.prioritySnapshot), hSort.dir);
      case 'machine': return cmpValues(`${mA?.assetCode || ''} ${mA?.name || ''}`, `${mB?.assetCode || ''} ${mB?.name || ''}`, hSort.dir);
      case 'title': return cmpValues(a.summaryTitle, b.summaryTitle, hSort.dir);
      case 'pic': return cmpValues(a.personInCharge, b.personInCharge, hSort.dir);
      case 'created': return cmpValues(a.createdAtMillis || 0, b.createdAtMillis || 0, hSort.dir);
      case 'recorded':
      default:
        return cmpValues(a.completedAtMillis || 0, b.completedAtMillis || 0, hSort.dir);
    }
  });

  return `
    <div class="between" style="gap:8px;">
      <div class="row" style="flex:1; min-width:240px;">
        <input style="max-width:260px;" placeholder="Search completed/rejected task, engineer, part..." value="${esc(appState.historySearch)}" oninput="appState.historySearch=this.value; renderTab()" />
        <select style="width:auto;" onchange="appState.historyPriority=this.value; renderTab()">
          <option value="ALL" ${appState.historyPriority==='ALL'?'selected':''}>All Priorities</option>
          <option value="URGENT" ${appState.historyPriority==='URGENT'?'selected':''}>URGENT</option>
          <option value="HIGH" ${appState.historyPriority==='HIGH'?'selected':''}>HIGH</option>
          <option value="NORMAL" ${appState.historyPriority==='NORMAL'?'selected':''}>NORMAL</option>
        </select>
        <select style="width:auto;" onchange="appState.historyCadence=this.value; renderTab()">
          <option value="ALL" ${appState.historyCadence==='ALL'?'selected':''}>All Cadences</option>
          ${['ONCE','DAILY','WEEKLY','MONTHLY','YEARLY'].map(c => `<option value="${c}" ${appState.historyCadence===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select style="width:auto;" onchange="appState.historyPic=this.value; renderTab()">
          <option value="ALL" ${appState.historyPic==='ALL'?'selected':''}>All Engineers</option>
          ${picNames.map(p => `<option value="${esc(p)}" ${appState.historyPic===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <select style="width:auto;" onchange="appState.historyGroupId=this.value; renderTab()">
          <option value="ALL" ${appState.historyGroupId==='ALL'?'selected':''}>All Groups</option>
          ${d.groups.map(g => `<option value="${g.id}" ${String(appState.historyGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
        </select>
      </div>
      <span class="muted">Auto-generated on Done or Rejected</span>
    </div>
    <div class="chip-row">
      ${['ALL','DONE','REJECTED'].map(o => `<button class="chip ${appState.historyOutcome===o?'active':''}" onclick="appState.historyOutcome='${o}'; renderTab()">${o === 'ALL' ? 'All Outcomes' : o}</button>`).join('')}
    </div>
    <table>
      <thead>
        <tr>
          ${sortableTh('history', 'outcome', 'Outcome & Cadence')}
          ${sortableTh('history', 'priority', 'Priority')}
          ${sortableTh('history', 'machine', 'Machine')}
          ${sortableTh('history', 'title', 'Task & Details / Parts')}
          ${sortableTh('history', 'pic', 'Engineers')}
          ${sortableTh('history', 'created', 'Created')}
          ${sortableTh('history', 'recorded', 'Recorded')}
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.length === 0 ? `<tr><td colspan="8" class="muted">No historical records match the filter.</td></tr>` :
          filtered.map(l => {
            const m = mMap[l.machineId];
            const g = gMap[l.groupId || m?.groupId];
            return `<tr>
              <td>
                ${outcomePillHtml(l.outcome)}
                ${l.cadenceSnapshot ? `<div style="margin-top:4px;"><span class="pill pill-primary">${esc(l.cadenceSnapshot)}</span></div>` : ''}
                ${g ? `<div class="muted" style="margin-top:3px;">${esc(g.name)}</div>` : ''}
              </td>
              <td>${l.prioritySnapshot ? priorityPillHtml(l.prioritySnapshot) : '<span class="muted">-</span>'}</td>
              <td><strong>${esc(m?.assetCode || '-')}</strong><div class="muted">${esc(m?.name || '')}</div></td>
              <td>
                <strong>${esc(l.summaryTitle)}</strong>
                ${l.outcome === 'REJECTED' && l.rejectionReason ? `<div style="color:var(--danger);font-size:12px;margin-top:3px;">Rejection reason: ${esc(l.rejectionReason)}</div>` : ''}
                ${l.malfunctionDetails ? `<div class="muted" style="margin-top:3px;">${esc(l.malfunctionDetails)}</div>` : ''}
                ${l.parts.length ? `<div style="margin-top:5px;">${l.parts.map(p => `<span class="pill pill-primary" style="margin-right:4px;">${esc(p.partCode)} ${esc(p.partName)} ×${p.quantity} ${esc(p.unit)}</span>`).join('')}</div>` : ''}
              </td>
              <td>
                <strong>${esc(l.personInCharge)}</strong>
                ${l.assistantEngineers ? `<div class="muted">+ ${esc(l.assistantEngineers)}</div>` : ''}
              </td>
              <td><div class="muted">${fmtDate(l.createdAtMillis)}</div></td>
              <td><div>${fmtDate(l.completedAtMillis)}</div><div class="muted">${l.serviceDurationMinutes > 0 ? l.serviceDurationMinutes + 'm' : 'Rejected'}</div></td>
              <td><button class="btn-sm btn-danger" onclick="deleteHistoryLog(${l.id})">Del</button></td>
            </tr>`;
          }).join('')}
      </tbody>
    </table>`;
}

async function saveTask(id) {
  const title = document.getElementById('t-title').value.trim();
  const pic = document.getElementById('t-pic').value.trim();
  if (!title) return showToast('Task title is required');
  if (!pic) return showToast('Select a registered engineer for PIC first');
  const dlStr = document.getElementById('t-deadline').value;
  const remEnabled = document.getElementById('t-rem-enabled').checked;
  const remVal = Math.max(1, Number(document.getElementById('t-rem-val').value) || 1);
  const remUnit = document.getElementById('t-rem-unit').value;
  const reminderLeadHours = remUnit === 'DAYS' ? remVal * 24 : remVal;

  await apiJson('/api/tasks', 'POST', {
    id,
    machineId: Number(document.getElementById('t-machine').value),
    machineStatus: document.getElementById('t-machine-status').value,
    groupId: document.getElementById('t-group').value ? Number(document.getElementById('t-group').value) : null,
    title,
    description: document.getElementById('t-desc').value,
    cadence: document.getElementById('t-cadence').value,
    priority: document.getElementById('t-priority').value,
    deadlineMillis: dlStr ? new Date(dlStr).getTime() : Date.now(),
    estimatedMinutes: Number(document.getElementById('t-est').value) || 30,
    personInCharge: pic,
    assistantEngineers: getCheckedAssistants('t').join(', '),
    reminderEnabled: remEnabled,
    reminderLeadHours
  });
  closeModal(); showToast('Task saved'); refreshState();
}

async function deleteTask(id) {
  if (!confirm('Delete this maintenance task?')) return;
  await apiJson(`/api/tasks/${id}`, 'DELETE');
  showToast('Task deleted'); refreshState();
}

// --- SEARCHABLE WAREHOUSE PICKER IN TASK COMPLETION ---
function renderDraftPartsBlock() {
  return `
    <div style="border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--surface-alt);">
      <div class="between" style="margin-bottom:6px;">
        <strong>Warehouse Spare Parts Used (${appState.draftParts.length})</strong>
      </div>
      <div id="draft-parts-selected">
        ${appState.draftParts.length === 0 ? `<div class="muted" style="margin-bottom:6px;">No spare parts selected yet. Search warehouse catalog below.</div>` :
          appState.draftParts.map((p, i) => `
            <div class="between" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;">
              <div>
                <span class="pill pill-primary">${esc(p.partCode)}</span>
                <strong>${esc(p.partName)}</strong>
                <div class="muted">${esc(p.partDescription)}</div>
              </div>
              <div class="row">
                <button class="btn-sm" type="button" onclick="adjustDraftPart(${i}, -1)">-</button>
                <strong>${p.quantity} ${esc(p.unit)}</strong>
                <button class="btn-sm" type="button" onclick="adjustDraftPart(${i}, 1)">+</button>
                <button class="btn-sm btn-danger" type="button" onclick="removeDraftPart(${i})">×</button>
              </div>
            </div>
          `).join('')}
      </div>
      <label style="margin-top:6px;">Search Warehouse Spare Parts (type at least 3 characters)</label>
      <input id="picker-query" placeholder="Type >= 3 letters (e.g. HF-, brg, bearing, 24V)..." oninput="renderPickerResults()" />
      <div class="picker-list" id="picker-results" style="margin-top:6px;"></div>
    </div>`;
}

function renderPickerResults() {
  const el = document.getElementById('picker-results');
  if (!el) return;
  const rawQuery = (document.getElementById('picker-query')?.value || '').trim();
  if (rawQuery.length < 3) {
    el.innerHTML = `<div class="muted" style="padding:10px;">Type at least 3 characters (Part ID/code or description) to search warehouse spare parts.</div>`;
    return;
  }
  const tokens = rawQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const parts = appState.data.warehouseParts.filter(w => {
    const hay = `${w.partCode} ${w.partName} ${w.partDescription}`.toLowerCase();
    return tokens.every(t => hay.includes(t));
  });
  el.innerHTML = parts.slice(0, 80).map(w => `
    <div class="picker-item" onclick="selectCatalogPart(${w.id})">
      <div>
        <span class="pill pill-primary">${esc(w.partCode)}</span>
        <span class="pill">${esc(w.defaultUnit)}</span>
        ${w.partName ? `<strong>${esc(w.partName)}</strong>` : ''}
        <div class="muted">${esc(w.partDescription)}</div>
      </div>
      <button type="button" class="btn-sm btn-primary">+ Select</button>
    </div>
  `).join('') || `<div class="muted" style="padding:10px;">No matching warehouse parts found.</div>`;
}

function selectCatalogPart(partId) {
  const item = appState.data.warehouseParts.find(w => w.id === partId);
  if (!item) return;
  const idx = appState.draftParts.findIndex(p => p.partCode.toLowerCase() === item.partCode.toLowerCase());
  if (idx >= 0) {
    appState.draftParts[idx].quantity += 1;
  } else {
    appState.draftParts.push({
      partCode: item.partCode,
      partName: item.partName || item.partCode,
      partDescription: item.partDescription,
      fromWarehouse: true,
      quantity: 1,
      unit: item.defaultUnit || 'pcs'
    });
  }
  document.getElementById('draft-parts-wrap').innerHTML = renderDraftPartsBlock();
  renderPickerResults();
}
function adjustDraftPart(idx, delta) {
  appState.draftParts[idx].quantity = Math.max(1, appState.draftParts[idx].quantity + delta);
  document.getElementById('draft-parts-wrap').innerHTML = renderDraftPartsBlock();
  renderPickerResults();
}
function removeDraftPart(idx) {
  appState.draftParts.splice(idx, 1);
  document.getElementById('draft-parts-wrap').innerHTML = renderDraftPartsBlock();
  renderPickerResults();
}

function openCompleteTaskModal(taskId) {

}

async function submitCompleteTask(taskId) {
  const pic = document.getElementById('ct-pic').value.trim();
  if (!pic) return showToast('Select a registered engineer for PIC first');
  await apiJson(`/api/tasks/${taskId}/complete`, 'POST', {
    personInCharge: pic,
    assistantEngineers: getCheckedAssistants('ct'),
    actualDurationMinutes: Number(document.getElementById('ct-min').value) || 30,
    notes: document.getElementById('ct-notes').value,
    flagMalfunction: false,
    severity: 'LOW',
    spareParts: appState.draftParts
  });

}

function openRejectTaskModal(taskId) {

async function submitRejectTask(taskId) {

        <div style="display:flex;flex-direction:column;gap:8px;">
          ${filtered.map(m => `

              <button class="btn-sm btn-danger" onclick="deleteMachine(${sel.id})">Delete</button>

            ${selTasks.map(t => `
              <div style="border:1px solid var(--border);border-radius:10px;padding:10px;">

                  <div>
                    <span class="pill pill-primary">${esc(t.cadence)}</span>

              <div style="border:1px solid var(--border);border-radius:10px;padding:10px;">

// --- 3. WAREHOUSE SPARE PARTS ---
function renderWarehouse(root, d) {
  const tokens = appState.partSearch.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const wSort = appState.colSorts.warehouse || { key: 'partCode', dir: 'ASC' };
  const filtered = d.warehouseParts.filter(w => {
    if (!tokens.length) return true;
    const hay = `${w.partCode} ${w.partName} ${w.partDescription}`.toLowerCase();
    return tokens.every(t => hay.includes(t));
  }).sort((a, b) => {
    switch (wSort.key) {
      case 'partName': return cmpValues(a.partName || '', b.partName || '', wSort.dir);
      case 'partDescription': return cmpValues(a.partDescription || '', b.partDescription || '', wSort.dir);
      case 'defaultUnit': return cmpValues(a.defaultUnit || '', b.defaultUnit || '', wSort.dir);
      case 'partCode':
      default: return cmpValues(a.partCode || '', b.partCode || '', wSort.dir);
    }
  });
  root.innerHTML = `
    <div class="card">
      <div class="between" style="margin-bottom:10px;">
        <div>
          <strong>Warehouse Spare Parts Catalog (${filtered.length} / ${d.warehouseParts.length})</strong>
          <div class="muted">Codes &amp; descriptions master list (with machine usage history)</div>
        </div>
        <div class="row">
          <button onclick="triggerQuickExcelImport()">Import Excel (.xlsx)</button>
          <button class="btn-primary" onclick="openWarehouseModal()">+ Add Part</button>
        </div>
      </div>
      <input style="margin-bottom:10px;" placeholder="Search by Part Code / ID or Description..." value="${esc(appState.partSearch)}" oninput="appState.partSearch=this.value; renderTab()" />
      <table>
        <thead>
          <tr>
            ${sortableTh('warehouse', 'partCode', 'Part ID / Code')}
            ${sortableTh('warehouse', 'partName', 'Part Name')}
            ${sortableTh('warehouse', 'partDescription', 'Description')}
            ${sortableTh('warehouse', 'defaultUnit', 'Default Unit')}
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length === 0 ? `<tr><td colspan="5" class="muted">No matching spare parts.</td></tr>` :
            filtered.map(w => `<tr>
              <td><span class="pill pill-primary">${esc(w.partCode)}</span></td>
              <td><strong>${esc(w.partName || '-')}</strong></td>
              <td>${esc(w.partDescription)}</td>
              <td><span class="pill">${esc(w.defaultUnit)}</span></td>
              <td>
                <div class="row">
                  <button class="btn-sm" onclick="openPartHistoryModal(${w.id})">History</button>
                  <button class="btn-sm" onclick="openWarehouseModal(${w.id})">Edit</button>
                  <button class="btn-sm btn-danger" onclick="deleteWarehousePart(${w.id})">Del</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function openPartHistoryModal(partId) {
  const d = appState.data;
  const part = (d.warehouseParts || []).find(w => w.id === partId);
  if (!part) return;
  const mMap = byIdMap(d.machines);
  const code = String(part.partCode || '').trim().toLowerCase();
  const name = String(part.partName || '').trim().toLowerCase();
  const usages = [];
  (d.serviceLogs || []).forEach(l => {
    (l.parts || []).forEach(p => {
      const pCode = String(p.partCode || '').trim().toLowerCase();
      const pName = String(p.partName || '').trim().toLowerCase();
      if ((code && pCode === code) || (name && pName === name)) {
        usages.push({ log: l, part: p, machine: mMap[l.machineId] });
      }
    });
  });
  usages.sort((a, b) => (b.log.completedAtMillis || 0) - (a.log.completedAtMillis || 0));

  const bodyHtml = usages.length === 0
    ? `<div class="muted">This spare part has not been recorded on any machine maintenance history yet.</div>`
    : `<table>
        <thead><tr><th>Outcome</th><th>Machine</th><th>Task</th><th>Qty</th><th>Engineers</th><th>Date Used</th></tr></thead>
        <tbody>
          ${usages.map(u => `<tr>
            <td>${outcomePillHtml(u.log.outcome)}</td>
            <td><strong>${esc(u.machine?.assetCode || '-')}</strong><div class="muted">${esc(u.machine?.name || 'Unknown')}</div></td>
            <td><strong>${esc(u.log.summaryTitle)}</strong></td>
            <td><span class="pill pill-primary">×${u.part.quantity} ${esc(u.part.unit)}</span></td>
            <td>${esc(u.log.personInCharge)}${u.log.assistantEngineers ? `<div class="muted">+ ${esc(u.log.assistantEngineers)}</div>` : ''}</td>
            <td><div>${fmtDate(u.log.completedAtMillis)}</div><div class="muted">Created: ${fmtDate(u.log.createdAtMillis)}</div></td>
          </tr>`).join('')}
        </tbody>
      </table>`;

  openModal(`${part.partCode} — Usage History (${usages.length})`, `
    <div class="muted">${esc(part.partName || part.partDescription)}</div>
    ${bodyHtml}
  `, '');
}

function openWarehouseModal(id = null) {
  const w = id ? appState.data.warehouseParts.find(x => x.id === id) : null;
  openModal(w ? 'Edit Warehouse Spare Part' : 'Add Warehouse Spare Part', `

      <div><label>Spare Part ID / Code *</label><input id="wp-code" value="${esc(w?.partCode || '')}" placeholder="e.g. BRG-6205-2RS" /></div>
      <div><label>Default Unit</label><input id="wp-unit" value="${esc(w?.defaultUnit || 'pcs')}" /></div>

// --- 4. ENGINEERS ROSTER ---
function renderEngineers(root, d) {
  const engineers = d.engineers || [];
  const q = appState.engineerSearch.trim().toLowerCase();
  const eSort = appState.colSorts.engineers || { key: 'name', dir: 'ASC' };

  const enriched = engineers.filter(e => {
    if (!q) return true;
    return `${e.name} ${e.employeeCode} ${e.role} ${e.shift}`.toLowerCase().includes(q);
  }).map(e => {
    const lower = e.name.toLowerCase();
    const activeCount = d.tasks.filter(t => t.personInCharge.toLowerCase() === lower || parseEngineerList(t.assistantEngineers).some(a => a.toLowerCase() === lower)).length;
    const histCount = d.serviceLogs.filter(l => l.personInCharge.toLowerCase() === lower || parseEngineerList(l.assistantEngineers).some(a => a.toLowerCase() === lower)).length;
    return { e, activeCount, histCount };
  }).sort((a, b) => {
    switch (eSort.key) {
      case 'employeeCode': return cmpValues(a.e.employeeCode || '', b.e.employeeCode || '', eSort.dir);
      case 'role': return cmpValues(a.e.role || '', b.e.role || '', eSort.dir);
      case 'shift': return cmpValues(a.e.shift || '', b.e.shift || '', eSort.dir);
      case 'activeCount': return cmpValues(a.activeCount, b.activeCount, eSort.dir);
      case 'histCount': return cmpValues(a.histCount, b.histCount, eSort.dir);
      case 'name':
      default: return cmpValues(a.e.name || '', b.e.name || '', eSort.dir);
    }
  });

  root.innerHTML = `
    <div class="card">
      <div class="between" style="margin-bottom:10px;">
        <div>
          <strong>Registered Maintenance Engineers (${enriched.length})</strong>
          <div class="muted">Only engineers listed here can be assigned as PIC or Assistants</div>
        </div>
        <button class="btn-primary" onclick="openEngineerModal()">+ Add Engineer</button>
      </div>
      <input style="margin-bottom:10px;" placeholder="Search by name, employee ID, role, shift..." value="${esc(appState.engineerSearch)}" oninput="appState.engineerSearch=this.value; renderTab()" />
      <table>
        <thead>
          <tr>
            ${sortableTh('engineers', 'name', 'Engineer')}

function openEngineerTasksModal(engineerId) {
  const d = appState.data;
  const eng = (d.engineers || []).find(e => e.id === engineerId);
  if (!eng) return;
  const mMap = byIdMap(d.machines);
  const lower = eng.name.toLowerCase();
  const assigned = d.tasks.filter(t =>
    t.personInCharge.toLowerCase() === lower ||
    parseEngineerList(t.assistantEngineers).some(a => a.toLowerCase() === lower)
  ).sort((a, b) => a.deadlineMillis - b.deadlineMillis);

  const listHtml = assigned.length === 0
    ? `<div class="muted">No active tasks currently assigned to ${esc(eng.name)}.</div>`
    : assigned.map(t => {
        const m = mMap[t.machineId];
        const isPic = t.personInCharge.toLowerCase() === lower;
        return `
          <div style="border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface-alt);">
            <div class="between">
              <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                ${priorityPillHtml(t.priority)}
                <span class="pill pill-primary">${esc(t.cadence)}</span>
                <span class="pill pill-ok">${isPic ? 'PIC' : 'Assistant'}</span>
              </div>
              <span class="muted">${fmtDate(t.deadlineMillis)}</span>
            </div>
            <div style="font-weight:700;margin-top:5px;">${esc(t.title)}</div>
            <div class="muted">${esc(m?.assetCode || '-')} · ${esc(m?.name || '')} · Created: ${fmtDate(t.createdAtMillis)}</div>
            <div class="row" style="margin-top:8px;justify-content:flex-end;">
              <button class="btn-sm" onclick="closeModal(); openTaskModal(${t.id})">Edit</button>
              <button class="btn-sm btn-danger" onclick="closeModal(); openRejectTaskModal(${t.id})">Reject</button>
              <button class="btn-primary btn-sm" onclick="closeModal(); openCompleteTaskModal(${t.id})">Complete</button>
            </div>
          </div>`;
      }).join('');

  openModal(
    `${eng.name} — Active Tasks (${assigned.length})`,
    `<div class="muted">${esc(eng.role)} · ${esc(eng.shift)}</div>${listHtml}`,
    assigned.length > 0
      ? `<button class="btn-primary" onclick="filterTasksByEngineer(${eng.id})">Filter in Tasks Tab</button>`
      : ''
  );
}

function openEngineerHistoryModal(engineerId) {
  const d = appState.data;
  const eng = (d.engineers || []).find(e => e.id === engineerId);
  if (!eng) return;
  const mMap = byIdMap(d.machines);
  const lower = eng.name.toLowerCase();
  const logs = d.serviceLogs.filter(l =>
    l.personInCharge.toLowerCase() === lower ||
    parseEngineerList(l.assistantEngineers).some(a => a.toLowerCase() === lower)
  ).sort((a, b) => (b.completedAtMillis || 0) - (a.completedAtMillis || 0));

  const listHtml = logs.length === 0
    ? `<div class="muted">No historical tasks recorded yet for ${esc(eng.name)}.</div>`
    : logs.map(l => {
        const m = mMap[l.machineId];
        const isPic = l.personInCharge.toLowerCase() === lower;
        return `
          <div style="border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface-alt);">
            <div class="between">
              <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                ${outcomePillHtml(l.outcome)}
                ${l.prioritySnapshot ? priorityPillHtml(l.prioritySnapshot) : ''}
                ${l.cadenceSnapshot ? `<span class="pill pill-primary">${esc(l.cadenceSnapshot)}</span>` : ''}
                <span class="pill">${isPic ? 'PIC' : 'Assistant'}</span>
              </div>
              <span class="muted">${fmtDate(l.completedAtMillis)}</span>
            </div>
            <div style="font-weight:700;margin-top:5px;">${esc(l.summaryTitle)}</div>
            <div class="muted">${esc(m?.assetCode || '-')} · ${esc(m?.name || '')} · Created: ${fmtDate(l.createdAtMillis)}</div>
            ${l.outcome === 'REJECTED' && l.rejectionReason ? `<div style="color:var(--danger);font-size:12px;margin-top:4px;">Rejection reason: ${esc(l.rejectionReason)}</div>` : ''}
            ${l.malfunctionDetails ? `<div class="muted" style="margin-top:4px;">${esc(l.malfunctionDetails)}</div>` : ''}
            ${(l.parts || []).length ? `<div style="margin-top:5px;">${l.parts.map(p => `<span class="pill pill-primary" style="margin-right:4px;">${esc(p.partCode)} ${esc(p.partName)} ×${p.quantity} ${esc(p.unit)}</span>`).join('')}</div>` : ''}
          </div>`;
      }).join('');

  openModal(
    `${eng.name} — History (${logs.length})`,
    `<div class="muted">${esc(eng.role)} · ${esc(eng.shift)}</div>${listHtml}`,
    logs.length > 0
      ? `<button class="btn-primary" onclick="filterHistoryByEngineer(${eng.id})">Filter in History Tab</button>`
      : ''
  );
}

function filterTasksByEngineer(engineerId) {
  const eng = (appState.data.engineers || []).find(e => e.id === engineerId);
  if (!eng) return;
  closeModal();
  appState.taskPic = eng.name;
  appState.taskSubTab = 'active';
  switchTab('tasks');
}

function filterHistoryByEngineer(engineerId) {
  const eng = (appState.data.engineers || []).find(e => e.id === engineerId);

function openEngineerModal(id = null) {
  const e = id ? (appState.data.engineers || []).find(x => x.id === id) : null;
  openModal(e ? 'Edit Engineer' : 'Add Maintenance Engineer', `
    <div><label>Full Name *</label><input id="eng-name" value="${esc(e?.name || '')}" placeholder="e.g. Elena Vance" /></div>
    <div class="grid-2">
      <div><label>Employee Code / Badge</label><input id="eng-code" value="${esc(e?.employeeCode || '')}" placeholder="e.g. ENG-014" /></div>
      <div><label>Shift</label><select id="eng-shift">${['Day Shift','Night Shift','Swing Shift','On-Call'].map(s => `<option ${e?.shift===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div><label>Role / Specialty</label><input id="eng-role" value="${esc(e?.role || 'Maintenance Engineer')}" /></div>

async function saveEngineer(id) {
  const name = document.getElementById('eng-name').value.trim();
  if (!name) return showToast('Engineer name is required');
  await apiJson('/api/engineers', 'POST', {
    id,
    name,
    employeeCode: document.getElementById('eng-code').value.trim().toUpperCase(),
    role: document.getElementById('eng-role').value.trim() || 'Maintenance Engineer',
    shift: document.getElementById('eng-shift').value
  });
  closeModal(); showToast('Engineer saved'); refreshState();
}

async function deleteEngineer(id) {
  if (!confirm('Remove this engineer from the active roster?')) return;
  await apiJson(`/api/engineers/${id}`, 'DELETE');
  showToast('Engineer removed'); refreshState();
}

function parseVersionPartsWeb(raw) {
  const cleaned = String(raw || '').trim().replace(/^[vV]/, '').split('-')[0].split('+')[0];
  return cleaned.split('.').map(p => parseInt(p, 10)).filter(n => !Number.isNaN(n));
}

function isRemoteVersionNewerWeb(remoteTag, currentVersion) {
  const r = parseVersionPartsWeb(remoteTag);
  const c = parseVersionPartsWeb(currentVersion);
  const len = Math.max(r.length, c.length);
  if (!len) return false;
  for (let i = 0; i < len; i++) {
    const rv = r[i] || 0;
    const cv = c[i] || 0;
    if (rv > cv) return true;
    if (rv < cv) return false;
  }
  return false;
}

async function checkGithubReleaseWeb() {
  const repo = appState.data?.githubRepo || 'Lock001111/MachLog';
  const curVer = appState.data?.appVersionName || '1.0';
  appState.updateStatusText = 'Checking GitHub Releases...';
  renderTab();
  try {
    const resp = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (resp.status === 404) {
      appState.latestReleaseInfo = null;
      appState.updateStatusText = `No GitHub Releases published yet on ${repo}.`;
      renderTab();
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const rel = await resp.json();
    const tag = rel.tag_name || '';
    const apkAsset = (rel.assets || []).find(a => String(a.name || '').toLowerCase().endsWith('.apk') && a.browser_download_url);
    const newer = isRemoteVersionNewerWeb(tag, curVer);
    appState.latestReleaseInfo = {
      tagName: tag,
      htmlUrl: rel.html_url || `https://github.com/${repo}/releases`,
      apkUrl: apkAsset ? apkAsset.browser_download_url : null,
      isUpdateAvailable: newer
    };
    appState.updateStatusText = newer
      ? `New release available: ${tag} (installed v${curVer})`
      : `Up to date: installed v${curVer} matches latest ${tag}`;
  } catch (e) {
    appState.updateStatusText = 'Update check failed: ' + e.message;
  }
  renderTab();
}

function buildReportQuery() {
  const rf = appState.reportFilter;
  const p = new URLSearchParams();
  if (rf.machineId) p.set('machineId', rf.machineId);
  if (rf.groupId) p.set('customGroupId', rf.groupId);
  if (rf.pic) p.set('personInCharge', rf.pic);
  if (rf.cadence) p.set('cadence', rf.cadence);
  if (rf.outcome) p.set('outcome', rf.outcome);
  if (rf.start) p.set('startMillis', String(new Date(rf.start + 'T00:00:00').getTime()));
  if (rf.end) p.set('endMillis', String(new Date(rf.end + 'T23:59:59').getTime()));
  return p.toString();
}

async function downloadWithPin(url, fallbackName) {
  try {
    const resp = await apiFetch(url);
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fallbackName;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { showToast('Download failed: ' + e.message); }
}

function triggerQuickExcelImport() {
  const input = document.getElementById('quick-upload-xlsx');
  input.value = '';
  input.click();
}

async function handleQuickExcelUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const resp = await apiFetch('/api/excel/import?replace=false', {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream' },
    body: await file.arrayBuffer()
  });
  const json = await resp.json();
  if (!resp.ok || !json.ok) return showToast('Error: ' + json.message);
  showToast(json.message); refreshState();
}

async function uploadExcel(replace) {
  const file = document.getElementById('upload-xlsx').files[0];
  if (!file) return showToast('Select an .xlsx file first');
  if (replace && !confirm('Replace all existing records with this Excel workbook?')) return;
  const resp = await apiFetch(`/api/excel/import?replace=${replace}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream' },
    body: await file.arrayBuffer()
  });
  const json = await resp.json();
  if (!resp.ok || !json.ok) return showToast('Error: ' + json.message);
  showToast(json.message); refreshState();
}

async function uploadBackup(mode) {
  const file = document.getElementById('upload-json').files[0];
  if (!file) return showToast('Select a .json backup file first');
  if (mode === 'REPLACE' && !confirm('Replace all device records from this backup file?')) return;
  const resp = await apiFetch(`/api/backup/import?mode=${mode}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: await file.text()
  });
  const json = await resp.json();
  if (!resp.ok || !json.ok) return showToast('Error: ' + json.message);
  showToast(json.message); refreshState();
}

async function deleteGroup(id) { if (confirm('Delete custom group?')) { await apiJson(`/api/groups/${id}`, 'DELETE'); refreshState(); } }

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()">Cancel</button>` + footerHtml;
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }

refreshState();

function renderDraftPartsBlock() {
  return `
    <div style="border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--surface-alt);">
      <div class="between" style="margin-bottom:6px;">
        <strong>Warehouse Spare Parts Used (${appState.draftParts.length})</strong>
      </div>
      <div id="draft-parts-selected">
        ${appState.draftParts.length === 0 ? `<div class="muted" style="margin-bottom:6px;">No spare parts selected yet. Search warehouse catalog below.</div>` :
          appState.draftParts.map((p, i) => `
            <div class="between" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;">
              <div>
                <span class="pill pill-primary">${esc(p.partCode)}</span>
                <strong>${esc(p.partName)}</strong>
                <div class="muted">${esc(p.partDescription)}</div>
              </div>
              <div class="row">
                <button class="btn-sm" type="button" onclick="adjustDraftPart(${i}, -1)">-</button>
                <strong>${p.quantity} ${esc(p.unit)}</strong>
                <button class="btn-sm" type="button" onclick="adjustDraftPart(${i}, 1)">+</button>
                <button class="btn-sm btn-danger" type="button" onclick="removeDraftPart(${i})">×</button>
              </div>
            </div>
          `).join('')}
      </div>
      <label style="margin-top:6px;">Search Warehouse Spare Parts (type at least 3 characters)</label>
      <input id="picker-query" placeholder="Type >= 3 letters (e.g. HF-, brg, bearing, 24V)..." oninput="renderPickerResults()" />
      <div class="picker-list" id="picker-results" style="margin-top:6px;"></div>
    </div>`;
}

function renderPickerResults() {
  const el = document.getElementById('picker-results');
  if (!el) return;
  const rawQuery = (document.getElementById('picker-query')?.value || '').trim();
  if (rawQuery.length < 3) {
    el.innerHTML = `<div class="muted" style="padding:10px;">Type at least 3 characters (Part ID/code or description) to search warehouse spare parts.</div>`;
    return;
  }
  const tokens = rawQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const parts = appState.data.warehouseParts.filter(w => {
    const hay = `${w.partCode} ${w.partName} ${w.partDescription}`.toLowerCase();
    return tokens.every(t => hay.includes(t));
  });
  el.innerHTML = parts.slice(0, 80).map(w => `
    <div class="picker-item" onclick="selectCatalogPart(${w.id})">
      <div>
        <span class="pill pill-primary">${esc(w.partCode)}</span>
        <span class="pill">${esc(w.defaultUnit)}</span>
        ${w.partName ? `<strong>${esc(w.partName)}</strong>` : ''}
        <div class="muted">${esc(w.partDescription)}</div>
      </div>
      <button type="button" class="btn-sm btn-primary">+ Select</button>
    </div>
  `).join('') || `<div class="muted" style="padding:10px;">No matching warehouse parts found.</div>`;
}

function selectCatalogPart(partId) {
  const item = appState.data.warehouseParts.find(w => w.id === partId);
  if (!item) return;
  const idx = appState.draftParts.findIndex(p => p.partCode.toLowerCase() === item.partCode.toLowerCase());
  if (idx >= 0) {
    appState.draftParts[idx].quantity += 1;
  } else {
    appState.draftParts.push({
      partCode: item.partCode,
      partName: item.partName || item.partCode,
      partDescription: item.partDescription,
      fromWarehouse: true,
      quantity: 1,
      unit: item.defaultUnit || 'pcs'
    });
  }
  document.getElementById('draft-parts-wrap').innerHTML = renderDraftPartsBlock();
  renderPickerResults();
}
function adjustDraftPart(idx, delta) {
  appState.draftParts[idx].quantity = Math.max(1, appState.draftParts[idx].quantity + delta);
  document.getElementById('draft-parts-wrap').innerHTML = renderDraftPartsBlock();
  renderPickerResults();
}
function removeDraftPart(idx) {
  appState.draftParts.splice(idx, 1);
  document.getElementById('draft-parts-wrap').innerHTML = renderDraftPartsBlock();
  renderPickerResults();
}

// --- 2. MACHINES & AUTOMATED REPORTS ---
function toggleMachineGroupCollapse(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  appState.collapsedMachineGroups[title] = !appState.collapsedMachineGroups[title];
  renderTab();
}

function toggleMachineLogCollapse(encodedKey) {
  const key = decodeURIComponent(encodedKey);
  appState.collapsedMachineGroups['logs_' + key] = !appState.collapsedMachineGroups['logs_' + key];
  renderTab();
}

function renderMachines(root, d) {
  const gMap = byIdMap(d.groups);
  const q = appState.machineSearch.trim().toLowerCase();
  const filtered = d.machines.filter(m => {
    if (appState.machineStatus !== 'ALL' && m.status !== appState.machineStatus) return false;
    if (appState.machineGroupId !== 'ALL' && String(m.groupId || '') !== String(appState.machineGroupId)) return false;
    if (q && !`${m.assetCode} ${m.name} ${m.locationZone} ${m.modelInfo}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const paged = paginateWeb(filtered, 'machines');
  const sel = d.machines.find(m => m.id === appState.selectedMachineId) || paged.items[0] || filtered[0];
  const selTasks = sel ? d.tasks.filter(t => t.machineId === sel.id) : [];
  const selLogs = sel ? d.serviceLogs.filter(l => l.machineId === sel.id).sort((a, b) => (b.completedAtMillis || 0) - (a.completedAtMillis || 0)) : [];
  const pagedSelLogs = paginateWeb(selLogs, 'machineLogs');
  const logsSectionCollapsed = sel ? Boolean(appState.collapsedMachineGroups['logs_' + sel.id]) : false;

  const machineSections = [];
  if (appState.machineGroupBy === 'NONE') {
    machineSections.push({ title: 'All Machines', items: paged.items });
  } else {
    const bucket = new Map();
    paged.items.forEach(m => {
      const gTitle = appState.machineGroupBy === 'STATUS'
        ? (m.status || 'OPERATIONAL').replace('_', ' ')
        : (m.groupId && gMap[m.groupId] ? gMap[m.groupId].name : 'Ungrouped');
      if (!bucket.has(gTitle)) bucket.set(gTitle, []);
      bucket.get(gTitle).push(m);
    });
    bucket.forEach((items, title) => machineSections.push({ title, items }));
  }

  let machineListHtml = '';
  if (paged.items.length === 0) {
    machineListHtml = `<div class="muted">No machines match.</div>`;
  } else {
    machineSections.forEach(sec => {
      if (appState.machineGroupBy !== 'NONE') {
        const collapsed = Boolean(appState.collapsedMachineGroups[sec.title]);
        const encoded = encodeURIComponent(sec.title);
        machineListHtml += `
          <div onclick="toggleMachineGroupCollapse('${encoded}')" style="cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border);font-weight:700;font-size:12px;" class="between">
            <span>${collapsed ? '▶' : '▼'} ${esc(sec.title)}</span>
            <span class="pill">${sec.items.length}</span>
          </div>`;
        if (collapsed) return;
      }
      sec.items.forEach(m => {
        machineListHtml += `
          <div onclick="appState.selectedMachineId=${m.id}; appState.pages.machineLogs=0; renderTab()" style="cursor:pointer;padding:10px;border-radius:10px;border:1px solid ${sel?.id===m.id?'var(--primary)':'var(--border)'};background:${sel?.id===m.id?'var(--primary-soft)':'var(--surface)'};">
            <div class="between"><strong>${esc(m.assetCode)}</strong>${statusPillHtml(m.status)}</div>
            <div style="font-weight:600;margin-top:3px;">${esc(m.name)}</div>
            <div class="muted">${esc(m.locationZone)} ${gMap[m.groupId] ? '· ' + esc(gMap[m.groupId].name) : ''}</div>
          </div>`;
      });
    });
  }

  root.innerHTML = `
    <div class="grid-split">
      <div class="card">
        <div class="between" style="margin-bottom:10px;">
          <strong>Machines (${filtered.length})</strong>
          <div class="row">
            <button class="btn btn-sm" title="Import Excel (.xlsx)" onclick="triggerQuickExcelImport()">${iconSvg('upload')} Import</button>
            <button class="btn-primary btn-std" title="Add Machine" onclick="openMachineModal()">${iconSvg('plus')} Add Machine</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px;">
          <input placeholder="Search asset code, machine, zone, model..." value="${esc(appState.machineSearch)}" oninput="appState.machineSearch=this.value; appState.pages.machines=0; renderTab()" />
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <select onchange="appState.machineGroupBy=this.value; renderTab()">
              <option value="CUSTOM_GROUP" ${appState.machineGroupBy==='CUSTOM_GROUP'?'selected':''}>Group: Custom Group</option>
              <option value="STATUS" ${appState.machineGroupBy==='STATUS'?'selected':''}>Group: Status</option>
              <option value="NONE" ${appState.machineGroupBy==='NONE'?'selected':''}>Flat List</option>
            </select>
            <select onchange="appState.machineGroupId=this.value; appState.pages.machines=0; renderTab()">
              <option value="ALL" ${appState.machineGroupId==='ALL'?'selected':''}>All Groups</option>
              ${d.groups.map(g => `<option value="${g.id}" ${String(appState.machineGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="chip-row">
          ${['ALL','OPERATIONAL','MAINTENANCE_DUE','MALFUNCTION'].map(s => `<button class="chip ${appState.machineStatus===s?'active':''}" onclick="appState.machineStatus='${s}'; appState.pages.machines=0; renderTab()">${s.replace('_',' ')}</button>`).join('')}
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${machineListHtml}
        </div>
        ${paginationBarHtml(paged, 'machines')}
      </div>

      <div class="card">
        ${!sel ? `<div class="muted">Select a machine to view tasks &amp; automated history.</div>` : `
          <div class="between">
            <div>
              <span class="pill pill-primary">${esc(sel.assetCode)}</span> ${statusPillHtml(sel.status)}
              <h2 style="margin:6px 0 2px;font-size:18px;">${esc(sel.name)}</h2>
              <div class="muted">${esc(sel.locationZone)} · ${esc(sel.modelInfo)}</div>
              ${sel.notes ? `<p style="font-size:13px;margin:8px 0 0;">${esc(sel.notes)}</p>` : ''}
            </div>
            <div class="row">
              <button class="btn-primary btn-std" title="New Task for Machine" onclick="openTaskModal(null, ${sel.id})">${iconSvg('plus')} New Task</button>
              <button class="icon-btn" title="Edit Machine" aria-label="Edit Machine" onclick="openMachineModal(${sel.id})">${iconSvg('edit')}</button>

          <strong>Active Tasks (${selTasks.length})</strong>

          <div class="between" style="cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border);" onclick="toggleMachineLogCollapse('${encodeURIComponent(String(sel.id))}')">

function fmtCurrencyPriceWeb(price, currency = 'USD') {
  if (price === null || price === undefined || Number.isNaN(Number(price))) return '-';
  const cur = String(currency || 'USD').trim().toUpperCase() || 'USD';
  const symbols = { USD: '$', EUR: '€', GBP: '£', JPY: '¥', IDR: 'Rp ', SGD: 'S$', MYR: 'RM ' };
  const sym = symbols[cur] || (cur + ' ');
  const dec = (cur === 'JPY' || cur === 'IDR') ? 0 : 2;
  return sym + Number(price).toFixed(dec);
}

    const sup = w.supplierId ? supMap[w.supplierId] : null;
    const hay = `${w.partCode} ${w.partName} ${w.partDescription} ${w.supplierPartSku || ''} ${sup?.companyName || ''}`.toLowerCase();
    return tokens.every(t => hay.includes(t));
  }).sort((a, b) => {
    switch (wSort.key) {
      case 'partName': return cmpValues(a.partName || '', b.partName || '', wSort.dir);
      case 'partDescription': return cmpValues(a.partDescription || '', b.partDescription || '', wSort.dir);
      case 'supplier': {
        const sa = a.supplierId && supMap[a.supplierId] ? supMap[a.supplierId].companyName : '';
        const sb = b.supplierId && supMap[b.supplierId] ? supMap[b.supplierId].companyName : '';
        return cmpValues(sa, sb, wSort.dir);
      }
      case 'unitPrice': return cmpValues(Number(a.unitPrice ?? -1), Number(b.unitPrice ?? -1), wSort.dir);
      case 'defaultUnit': return cmpValues(a.defaultUnit || '', b.defaultUnit || '', wSort.dir);
      case 'partCode':
      default: return cmpValues(a.partCode || '', b.partCode || '', wSort.dir);

        <input placeholder="Search by Part Code / ID, description, SKU, or supplier..." value="${esc(appState.partSearch)}" oninput="appState.partSearch=this.value; appState.pages.warehouse=0; renderTab()" />
      </div>
      <table>
        <thead>
          <tr>
            ${sortableTh('warehouse', 'partCode', 'Part ID / Code')}
            ${sortableTh('warehouse', 'partName', 'Part Name')}
            ${sortableTh('warehouse', 'partDescription', 'Description')}
            ${sortableTh('warehouse', 'supplier', 'Supplier')}
            ${sortableTh('warehouse', 'unitPrice', 'Unit Price')}
            ${sortableTh('warehouse', 'defaultUnit', 'Unit')}
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length === 0 ? `<tr><td colspan="7" class="muted">No matching spare parts.</td></tr>` :
            paged.items.map(w => {
              const sup = w.supplierId ? supMap[w.supplierId] : null;
              return `<tr>
              <td><span class="pill pill-primary">${esc(w.partCode)}</span>${w.supplierPartSku ? `<div class="muted" style="margin-top:3px;">SKU: ${esc(w.supplierPartSku)}</div>` : ''}</td>
              <td><strong>${esc(w.partName || '-')}</strong></td>
              <td>${esc(w.partDescription)}</td>
              <td>${sup ? `<button class="pill-btn info" onclick="openPartSupplierModal(${w.id})">${iconSvg('supplier')} <span>${esc(sup.companyName)}</span></button>` : `<span class="muted">Not linked</span>`}</td>
              <td><strong>${esc(fmtCurrencyPriceWeb(w.unitPrice, w.currency))}</strong>${w.leadTimeDays ? `<div class="muted">${w.leadTimeDays}d lead</div>` : ''}</td>

function openPartHistoryModal(partId) {
  const d = appState.data;
  const part = (d.warehouseParts || []).find(w => w.id === partId);
  if (!part) return;
  const mMap = byIdMap(d.machines);
  const code = String(part.partCode || '').trim().toLowerCase();
  const name = String(part.partName || '').trim().toLowerCase();
  const usages = [];
  (d.serviceLogs || []).forEach(l => {
    (l.parts || []).forEach(p => {
      const pCode = String(p.partCode || '').trim().toLowerCase();
      const pName = String(p.partName || '').trim().toLowerCase();
      if ((code && pCode === code) || (name && pName === name)) {
        usages.push({ log: l, part: p, machine: mMap[l.machineId] });
      }
    });
  });
  usages.sort((a, b) => (b.log.completedAtMillis || 0) - (a.log.completedAtMillis || 0));

  const bodyHtml = usages.length === 0
    ? `<div class="muted">This spare part has not been recorded on any machine maintenance history yet.</div>`
    : `<table>
        <thead><tr><th>Outcome</th><th>Machine</th><th>Task</th><th>Qty</th><th>Engineers</th><th>Date Used</th></tr></thead>
        <tbody>
          ${usages.map(u => `<tr>
            <td>${outcomePillHtml(u.log.outcome)}</td>
            <td><strong>${esc(u.machine?.assetCode || '-')}</strong><div class="muted">${esc(u.machine?.name || 'Unknown')}</div></td>
            <td><strong>${esc(u.log.summaryTitle)}</strong></td>

          </tr>`).join('')}
        </tbody>
      </table>`;

  openModal(`${part.partCode} — Usage History (${usages.length})`, `
    <div class="muted">${esc(part.partName || part.partDescription)}</div>
    ${bodyHtml}
  `, '');
}

async function saveWarehousePart(id, btnEl) {
  const partCode = document.getElementById('wp-code').value.trim();
  const partDescription = document.getElementById('wp-desc').value.trim();
  const partName = document.getElementById('wp-name').value.trim();
  if (!partCode || (!partDescription && !partName)) return showToast('Part Code and Description are required');
  const supVal = document.getElementById('wp-supplier').value;
  const priceRaw = document.getElementById('wp-price').value.trim();
  const leadRaw = document.getElementById('wp-lead').value.trim();
  await withBusy('Saving part...', async () => {
    await apiJson('/api/warehouse', 'POST', {
      id,
      partCode,
      partName,
      partDescription: partDescription || partName,
      defaultUnit: document.getElementById('wp-unit').value.trim() || 'pcs',
      supplierId: supVal ? Number(supVal) : null,
      supplierPartSku: document.getElementById('wp-sku').value.trim(),
      unitPrice: priceRaw !== '' ? Number(priceRaw) : null,
      currency: (document.getElementById('wp-currency').value.trim() || 'USD').toUpperCase(),
      leadTimeDays: leadRaw !== '' ? Number(leadRaw) : null
    });
    closeModal();
    showToast('Warehouse part saved');
    await refreshState(true);
  }, btnEl);
}

async function deleteWarehousePart(id, btnEl) {
  if (!confirm('Remove this spare part from catalog?')) return;
  await withBusy('Deleting...', async () => {
    await apiJson(`/api/warehouse/${id}`, 'DELETE');
    await refreshState(true);
  }, btnEl);
}

function renderEngineers(root, d) {
  const engineers = d.engineers || [];
  const q = appState.engineerSearch.trim().toLowerCase();
  const eSort = appState.colSorts.engineers || { key: 'name', dir: 'ASC' };

  const enriched = engineers.filter(e => {
    if (!q) return true;
    return `${e.name} ${e.employeeCode} ${e.role} ${e.shift}`.toLowerCase().includes(q);
  }).map(e => {
    const lower = e.name.toLowerCase();
    const activeCount = d.tasks.filter(t => t.personInCharge.toLowerCase() === lower || parseEngineerList(t.assistantEngineers).some(a => a.toLowerCase() === lower)).length;
    const histCount = d.serviceLogs.filter(l => l.personInCharge.toLowerCase() === lower || parseEngineerList(l.assistantEngineers).some(a => a.toLowerCase() === lower)).length;
    return { e, activeCount, histCount };
  }).sort((a, b) => {
    switch (eSort.key) {
      case 'employeeCode': return cmpValues(a.e.employeeCode || '', b.e.employeeCode || '', eSort.dir);
      case 'role': return cmpValues(a.e.role || '', b.e.role || '', eSort.dir);
      case 'shift': return cmpValues(a.e.shift || '', b.e.shift || '', eSort.dir);
      case 'activeCount': return cmpValues(a.activeCount, b.activeCount, eSort.dir);
      case 'histCount': return cmpValues(a.histCount, b.histCount, eSort.dir);
      case 'name':
      default: return cmpValues(a.e.name || '', b.e.name || '', eSort.dir);
    }
  });

  const paged = paginateWeb(enriched, 'engineers');

  root.innerHTML = `
    <div class="card">
      <div class="between" style="margin-bottom:10px;">
        <div>
          <strong>Registered Maintenance Engineers (${enriched.length})</strong>

      </div>
      <table>
        <thead>
          <tr>

            ${sortableTh('engineers', 'employeeCode', 'Employee ID')}
            ${sortableTh('engineers', 'role', 'Role')}
            ${sortableTh('engineers', 'shift', 'Shift')}
            ${sortableTh('engineers', 'activeCount', 'Active Tasks')}
            ${sortableTh('engineers', 'histCount', 'History Log')}
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${enriched.length === 0 ? `<tr><td colspan="7" class="muted">No engineers match the search.</td></tr>` :
            paged.items.map(({ e, activeCount, histCount }) => `<tr>
              <td><strong>${esc(e.name)}</strong></td>
              <td>${e.employeeCode ? `<span class="pill pill-primary">${esc(e.employeeCode)}</span>` : '-'}</td>
              <td>${esc(e.role)}</td>
              <td><span class="pill">${esc(e.shift)}</span></td>
              <td>
                <button class="pill-btn info" title="Inspect Active Tasks" onclick="openEngineerTasksModal(${e.id})">
                  ${iconSvg('tasks')} <span>${activeCount} Active</span>
                </button>
              </td>
              <td>
                <button class="pill-btn ok" title="Inspect History Log" onclick="openEngineerHistoryModal(${e.id})">
                  ${iconSvg('history')} <span>${histCount} History</span>
                </button>
              </td>

                <div class="row" style="gap:5px;flex-wrap:nowrap;">

    t.personInCharge.toLowerCase() === lower ||

// --- 5. REPORTS ---
function filterReportsList(d) {
  const rf = appState.reportFilter;
  const mMap = byIdMap(d.machines);
  const startMs = rf.start ? new Date(rf.start + 'T00:00:00').getTime() : null;
  const endMs = rf.end ? new Date(rf.end + 'T23:59:59').getTime() : null;
  return (d.serviceLogs || []).filter(l => {
    const m = mMap[l.machineId];
    const effGroupId = l.groupId || m?.groupId || null;
    if (rf.machineId && String(l.machineId) !== String(rf.machineId)) return false;
    if (rf.groupId && String(effGroupId || '') !== String(rf.groupId)) return false;
    if (rf.pic) {
      const picLower = rf.pic.toLowerCase();
      const isPic = (l.personInCharge || '').toLowerCase() === picLower;
      const isAst = parseEngineerList(l.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (rf.cadence && (l.cadenceSnapshot || '') !== rf.cadence) return false;
    if (rf.outcome && l.outcome !== rf.outcome) return false;
    if (startMs && (l.completedAtMillis || 0) < startMs) return false;
    if (endMs && (l.completedAtMillis || 0) > endMs) return false;
    return true;
  }).sort((a, b) => (b.completedAtMillis || 0) - (a.completedAtMillis || 0));
}

function toggleReportGroupCollapse(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  appState.collapsedReportGroups[title] = !appState.collapsedReportGroups[title];
  renderTab();
}

function renderReports(root, d) {
  const rf = appState.reportFilter;
  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const pics = [...new Set([
    ...(d.engineers || []).map(e => e.name),
    ...d.tasks.map(t => t.personInCharge),
    ...d.serviceLogs.map(l => l.personInCharge)
  ].filter(Boolean))].sort();
  const qs = buildReportQuery();
  const matched = filterReportsList(d);
  const paged = paginateWeb(matched, 'reports');

  const reportSections = [];
  if (appState.reportGroupBy === 'NONE') {
    reportSections.push({ title: 'All Report Entries', logs: paged.items });
  } else {
    const bucket = new Map();
    paged.items.forEach(l => {
      const m = mMap[l.machineId];
      let gTitle = 'Ungrouped';
      if (appState.reportGroupBy === 'OUTCOME') gTitle = `${l.outcome} Jobs`;
      else if (appState.reportGroupBy === 'CADENCE') gTitle = l.cadenceSnapshot ? `${l.cadenceSnapshot} Maintenance` : 'Direct / Ad-Hoc Log';
      else if (appState.reportGroupBy === 'MACHINE') gTitle = m ? `${m.assetCode} · ${m.name}` : 'Unknown Machine';
      else if (appState.reportGroupBy === 'PIC') gTitle = l.personInCharge || 'Unassigned';
      else {
        const effGid = l.groupId || m?.groupId;
        gTitle = effGid && gMap[effGid] ? gMap[effGid].name : 'Ungrouped';
      }
      if (!bucket.has(gTitle)) bucket.set(gTitle, []);
      bucket.get(gTitle).push(l);
    });
    bucket.forEach((logs, title) => reportSections.push({ title, logs }));
  }

  const renderRepRow = (l) => {
    const m = mMap[l.machineId];
    return `<tr>
      <td>${outcomePillHtml(l.outcome)}${l.cadenceSnapshot ? `<div style="margin-top:4px;"><span class="pill pill-primary">${esc(l.cadenceSnapshot)}</span></div>` : ''}</td>
      <td><strong>${esc(m?.assetCode || '-')}</strong><div class="muted">${esc(m?.name || '')}</div></td>
      <td>
        <strong>${esc(l.summaryTitle)}</strong>
        ${l.outcome==='REJECTED' && l.rejectionReason ? `<div style="color:var(--danger);font-size:12px;">Reason: ${esc(l.rejectionReason)}</div>` : ''}
        ${l.malfunctionDetails ? `<div class="muted">${esc(l.malfunctionDetails)}</div>` : ''}
        ${(l.parts||[]).length ? `<div style="margin-top:4px;">${l.parts.map(p => `<span class="pill pill-primary" style="margin-right:4px;">${esc(p.partCode)} ${esc(p.partName)} ×${p.quantity}</span>`).join('')}</div>` : ''}
      </td>
      <td><strong>${esc(l.personInCharge)}</strong>${l.assistantEngineers ? `<div class="muted">+ ${esc(l.assistantEngineers)}</div>` : ''}</td>
      <td><div>${fmtDate(l.completedAtMillis)}</div><div class="muted">Created: ${fmtDate(l.createdAtMillis)}</div></td>
      <td><button class="icon-btn danger" title="Delete Log" aria-label="Delete Log" onclick="deleteHistoryLog(${l.id}, this)">${iconSvg('del')}</button></td>
    </tr>`;
  };

  let repBodyHtml = '';
  if (matched.length === 0) {
    repBodyHtml = `<tr><td colspan="6" class="muted">No report entries match the selected filters.</td></tr>`;
  } else {
    reportSections.forEach(sec => {
      if (appState.reportGroupBy !== 'NONE') {
        const collapsed = Boolean(appState.collapsedReportGroups[sec.title]);
        const secRej = sec.logs.filter(l => l.outcome === 'REJECTED').length;
        const encodedKey = encodeURIComponent(sec.title);
        repBodyHtml += `<tr class="group-row" onclick="toggleReportGroupCollapse('${encodedKey}')">
          <td colspan="6">
            <div class="between">
              <span>${collapsed ? '▶' : '▼'} ${esc(sec.title)}</span>
              <div class="row">
                ${secRej > 0 ? `<span class="pill pill-danger">${secRej} REJECTED</span>` : ''}
                <span class="pill">${sec.logs.length}</span>
              </div>
            </div>
          </td>
        </tr>`;
        if (!collapsed) repBodyHtml += sec.logs.map(renderRepRow).join('');
      } else {
        repBodyHtml += sec.logs.map(renderRepRow).join('');
      }
    });
  }

  root.innerHTML = `
    <div class="card">
      <div class="between" style="margin-bottom:10px;">
        <div>
          <strong>Export Filtered Reports (Excel &amp; PDF)</strong>
          <div class="muted">Reports are automatically generated when maintenance tasks are marked Done or Rejected</div>
        </div>
        <div class="row">
          <button class="btn-primary btn-std" onclick="downloadWithPin('/api/reports/export.xlsx?${qs}', 'MachinaLog_Report.xlsx')">${iconSvg('download')} Excel (.xlsx)</button>
          <button class="btn-std" onclick="downloadWithPin('/api/reports/export.pdf?${qs}', 'MachinaLog_Report.pdf')">${iconSvg('download')} PDF (.pdf)</button>
        </div>
      </div>
      <div class="grid-2">
        <div><label>Machine</label><select id="rf-m" onchange="appState.reportFilter.machineId=this.value; appState.pages.reports=0; renderTab()"><option value="">All Machines</option>${d.machines.map(m=>`<option value="${m.id}" ${rf.machineId==m.id?'selected':''}>${esc(m.assetCode)} · ${esc(m.name)}</option>`).join('')}</select></div>
        <div><label>Custom Group</label><select id="rf-g" onchange="appState.reportFilter.groupId=this.value; appState.pages.reports=0; renderTab()"><option value="">All Groups</option>${d.groups.map(g=>`<option value="${g.id}" ${rf.groupId==g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
        <div><label>Person In Charge</label><select id="rf-p" onchange="appState.reportFilter.pic=this.value; appState.pages.reports=0; renderTab()"><option value="">All Engineers</option>${pics.map(p=>`<option ${rf.pic===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
        <div><label>Cadence</label><select id="rf-c" onchange="appState.reportFilter.cadence=this.value; appState.pages.reports=0; renderTab()"><option value="">All Cadences</option>${['ONCE','DAILY','WEEKLY','MONTHLY','YEARLY'].map(c=>`<option ${rf.cadence===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>Task Outcome</label><select id="rf-o" onchange="appState.reportFilter.outcome=this.value; appState.pages.reports=0; renderTab()"><option value="">All Outcomes</option><option value="DONE" ${rf.outcome==='DONE'?'selected':''}>Done Only</option><option value="REJECTED" ${rf.outcome==='REJECTED'?'selected':''}>Rejected Only</option></select></div>
        <div><label>Group Report Rows By</label>
          <select onchange="appState.reportGroupBy=this.value; renderTab()">
            <option value="CUSTOM_GROUP" ${appState.reportGroupBy==='CUSTOM_GROUP'?'selected':''}>Group: Custom Group</option>
            <option value="OUTCOME" ${appState.reportGroupBy==='OUTCOME'?'selected':''}>Group: Outcome</option>

function parseVersionPartsWeb(raw) {
  const cleaned = String(raw || '').trim().replace(/^[vV]/, '').split('+')[0];
  const m = cleaned.match(/\d+(?:\.\d+)*/);
  if (!m) return [];
  return m[0].split('.').map(p => parseInt(p, 10)).filter(n => !Number.isNaN(n));
}

function compareVersionsWeb(aRaw, bRaw) {
  const r = parseVersionPartsWeb(aRaw);
  const c = parseVersionPartsWeb(bRaw);
  if (!r.length || !c.length) return 0;
  const len = Math.max(r.length, c.length);
  for (let i = 0; i < len; i++) {
    const rv = r[i] || 0;
    const cv = c[i] || 0;
    if (rv > cv) return 1;
    if (rv < cv) return -1;
  }
  return 0;
}

function isRemoteVersionNewerWeb(remoteTag, currentVersion) {
  const cmp = compareVersionsWeb(remoteTag, currentVersion);
  if (cmp !== 0) return cmp > 0;
  const r = parseVersionPartsWeb(remoteTag);
  const c = parseVersionPartsWeb(currentVersion);
  if (!r.length || !c.length) {
    const nr = String(remoteTag || '').trim().replace(/^[vV]/, '').toLowerCase();
    const nc = String(currentVersion || '').trim().replace(/^[vV]/, '').toLowerCase();
    return Boolean(nr && nr !== nc);
  }
  return false;
}

async function checkGithubReleaseWeb(btnEl = null) {
  const repo = appState.data?.githubRepo || 'Lock001111/MachLog';
  const curVer = appState.data?.appVersionName || '1.0';
  appState.updateStatusText = 'Checking GitHub Releases...';
  renderTab();
  await withBusy('Checking GitHub...', async () => {
    const listResp = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=10`, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    let chosen = null;
    if (listResp.ok) {
      const arr = await listResp.json();
      const nonDrafts = (Array.isArray(arr) ? arr : []).filter(r => r && !r.draft && r.tag_name);
      if (nonDrafts.length > 0) {
        chosen = nonDrafts.reduce((best, cur) => compareVersionsWeb(cur.tag_name, best.tag_name) > 0 ? cur : best, nonDrafts[0]);
      }
    }
    if (!chosen) {
      const latestResp = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
        headers: { 'Accept': 'application/vnd.github+json' }
      });
      if (latestResp.ok) chosen = await latestResp.json();
    }

    if (!chosen) {
      appState.latestReleaseInfo = null;
      let tagMsg = `No published GitHub Releases found yet on ${repo}.`;
      try {
        const tagResp = await fetch(`https://api.github.com/repos/${repo}/tags?per_page=5`);
        if (tagResp.ok) {
          const tags = await tagResp.json();
          if (Array.isArray(tags) && tags.length > 0 && tags[0].name) {
            tagMsg = `Tag "${tags[0].name}" exists, but no published GitHub Release + APK was found. Check Actions workflow permissions (Read & write).`;
          }
        }
      } catch (_) {}
      appState.updateStatusText = tagMsg;
      renderTab();
      return;
    }

    const tag = chosen.tag_name || '';
    const apkAsset = (chosen.assets || []).find(a => String(a.name || '').toLowerCase().endsWith('.apk') && a.browser_download_url);
    const newer = isRemoteVersionNewerWeb(tag, curVer);
    appState.latestReleaseInfo = {
      tagName: tag,
      htmlUrl: chosen.html_url || `https://github.com/${repo}/releases`,
      apkUrl: apkAsset ? apkAsset.browser_download_url : null,
      isUpdateAvailable: newer
    };
    appState.updateStatusText = newer
      ? `New ${chosen.prerelease ? 'pre-release' : 'release'} available: ${tag} (installed v${curVer})`
      : `Up to date: installed v${curVer} matches latest ${tag}`;
    renderTab();
  }, btnEl).catch(e => {
    appState.updateStatusText = 'Update check failed: ' + e.message;
    renderTab();
  });
}

function buildReportQuery() {
  const rf = appState.reportFilter;
  const p = new URLSearchParams();
  if (rf.machineId) p.set('machineId', rf.machineId);
  if (rf.groupId) p.set('customGroupId', rf.groupId);
  if (rf.pic) p.set('personInCharge', rf.pic);
  if (rf.cadence) p.set('cadence', rf.cadence);
  if (rf.outcome) p.set('outcome', rf.outcome);
  if (rf.start) p.set('startMillis', String(new Date(rf.start + 'T00:00:00').getTime()));
  if (rf.end) p.set('endMillis', String(new Date(rf.end + 'T23:59:59').getTime()));
  return p.toString();
}

async function downloadWithPin(url, fallbackName) {
  await withBusy('Preparing download...', async () => {
    const resp = await apiFetch(url);
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fallbackName;
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function toLocalDayKeyWeb(ms) {
  const dt = new Date(ms);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}

function dayKeyToDefaultMillisWeb(key) {
  const [y, m, d] = String(key).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1, 9, 0, 0, 0).getTime();
}

function openCalendarModal(resetToday = false) {
  const d = appState.data;
  if (!d) return;
  const now = Date.now();
  const todayKey = toLocalDayKeyWeb(now);
  if (resetToday || !appState.calendarSelectedDayKey) {
    const dt = new Date(now);
    appState.calendarYear = dt.getFullYear();
    appState.calendarMonth = dt.getMonth();
    appState.calendarSelectedDayKey = todayKey;
  }

  const dayMap = {};
  const addToDay = (key, kind, item) => {
    if (!dayMap[key]) dayMap[key] = { tasks: [], todos: [] };
    dayMap[key][kind].push(item);
  };
  if (appState.calendarFilter === 'ALL' || appState.calendarFilter === 'TASKS') {
    (d.tasks || []).slice().sort((a, b) => a.deadlineMillis - b.deadlineMillis).forEach(t => {
      addToDay(toLocalDayKeyWeb(t.deadlineMillis), 'tasks', t);
    });
  }
  if (appState.calendarFilter === 'ALL' || appState.calendarFilter === 'TODOS') {
    (d.todos || []).filter(td => appState.calendarShowDoneTodos || !td.isCompleted)
      .slice().sort((a, b) => a.dueAtMillis - b.dueAtMillis)
      .forEach(td => addToDay(toLocalDayKeyWeb(td.dueAtMillis), 'todos', td));
  }

  const year = appState.calendarYear;
  const month = appState.calendarMonth;
  const firstDay = new Date(year, month, 1);
  const leading = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = firstDay.toLocaleString([], { month: 'long', year: 'numeric' });
  const mMap = byIdMap(d.machines);

  let gridHtml = '';
  for (let i = 0; i < leading; i++) gridHtml += `<div class="cal-cell blank"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const bucket = dayMap[key] || { tasks: [], todos: [] };
    const isSel = appState.calendarSelectedDayKey === key;
    const isToday = key === todayKey;
    const hasOverdue = bucket.tasks.some(t => t.deadlineMillis < now) || bucket.todos.some(td => !td.isCompleted && td.dueAtMillis < now);
    const previewTags = [
      ...bucket.tasks.slice(0, 2).map(t => `<span class="cal-tag task ${t.deadlineMillis < now ? 'late' : ''}">${esc(t.title)}</span>`),
      ...bucket.todos.slice(0, Math.max(0, 3 - Math.min(2, bucket.tasks.length))).map(td => `<span class="cal-tag todo">${esc(td.title)}</span>`)
    ];
    const total = bucket.tasks.length + bucket.todos.length;
    const overflow = total > previewTags.length ? `<span class="muted" style="font-size:10px;">+${total - previewTags.length} more</span>` : '';

    gridHtml += `
      <div class="cal-cell ${isSel ? 'selected' : ''} ${isToday ? 'today' : ''} ${hasOverdue ? 'overdue' : ''}" onclick="appState.calendarSelectedDayKey='${key}'; openCalendarModal(false)">
        <div class="cal-day-num">
          <span>${day}</span>
          ${total > 0 ? `<span class="pill ${hasOverdue ? 'pill-danger' : 'pill-primary'}" style="font-size:10px;padding:1px 5px;">${total}</span>` : ''}
        </div>
        <div class="cal-tags">${previewTags.join('')}${overflow}</div>
      </div>`;
  }

  const selKey = appState.calendarSelectedDayKey || todayKey;
  const selBucket = dayMap[selKey] || { tasks: [], todos: [] };
  const selMillis = dayKeyToDefaultMillisWeb(selKey);
  const selDateHeading = new Date(selMillis).toLocaleDateString([], { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

  const detailHtml = (selBucket.tasks.length === 0 && selBucket.todos.length === 0)
    ? `<div class="muted">No maintenance tasks or to-do reminders scheduled on ${esc(selDateHeading)}.</div>`
    : [
        ...selBucket.tasks.map(t => {
          const m = mMap[t.machineId];
          const late = t.deadlineMillis < now;
          return `<div class="eng-modal-card ${late ? 'alert-card' : 'active-card'}">
            <div class="between">
              <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                <span class="pill pill-primary">TASK</span>
                ${priorityPillHtml(t.priority)}
                <span class="pill">${esc(t.cadence)}</span>
              </div>
              <span class="muted">${fmtDate(t.deadlineMillis)}</span>
            </div>
            <div style="font-weight:700;margin-top:4px;">${esc(t.title)}</div>
            <div class="muted">${esc(m?.assetCode || '-')} · ${esc(m?.name || '')} · PIC: ${esc(t.personInCharge)}</div>
            ${t.description ? `<div class="muted" style="margin-top:3px;">${esc(t.description)}</div>` : ''}
            <div class="row" style="margin-top:8px;justify-content:flex-end;gap:6px;">
              <button class="icon-btn" title="Edit Task" onclick="closeModal(); openTaskModal(${t.id})">${iconSvg('edit')}</button>
              <button class="icon-btn danger" title="Reject Task" onclick="closeModal(); openRejectTaskModal(${t.id})">${iconSvg('reject')}</button>
              <button class="icon-btn ok" title="Complete Task" onclick="closeModal(); openCompleteTaskModal(${t.id})">${iconSvg('complete')}</button>
            </div>
          </div>`;
        }),
        ...selBucket.todos.map(td => {
          const m = td.machineId ? mMap[td.machineId] : null;
          return `<div class="eng-modal-card" style="border:1.5px solid var(--warn);">
            <div class="between">
              <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                <span class="pill pill-warn">TO-DO</span>
                ${priorityPillHtml(td.priority)}
                <span class="pill">${esc(td.repeatRule)}</span>
                ${td.isCompleted ? `<span class="pill pill-ok">DONE</span>` : ''}
              </div>
              <span class="muted">${fmtDate(td.dueAtMillis)}</span>
            </div>
            <div style="font-weight:700;margin-top:4px;">${esc(td.title)}</div>
            <div class="muted">${m ? esc(m.assetCode) + ' · ' : ''}PIC: ${esc(td.personInCharge)}</div>
            ${td.notes ? `<div class="muted" style="margin-top:3px;">${esc(td.notes)}</div>` : ''}
            <div class="row" style="margin-top:8px;justify-content:flex-end;gap:6px;">
              <button class="icon-btn" title="Edit Reminder" onclick="closeModal(); openTodoModal(${td.id})">${iconSvg('edit')}</button>
              <button class="icon-btn ok" title="Toggle Done" onclick="toggleTodo(${td.id}, this).then(() => openCalendarModal(false))">${iconSvg('complete')}</button>
            </div>
          </div>`;
        })
      ].join('');

  const bodyHtml = `
    <div class="between">
      <div class="row">
        <button class="btn-sm" onclick="shiftCalendarMonth(-1)">&laquo; Prev</button>
        <strong style="min-width:140px;text-align:center;">${esc(monthLabel)}</strong>
        <button class="btn-sm" onclick="shiftCalendarMonth(1)">Next &raquo;</button>
        <button class="btn-sm" onclick="openCalendarModal(true)">Today</button>
      </div>
      <div class="row">
        ${['ALL','TASKS','TODOS'].map(f => `<button class="chip ${appState.calendarFilter===f?'active':''}" onclick="appState.calendarFilter='${f}'; openCalendarModal(false)">${f === 'ALL' ? 'All' : f === 'TASKS' ? 'Tasks' : 'To-Do'}</button>`).join('')}
        <label class="filter-check"><input type="checkbox" ${appState.calendarShowDoneTodos ? 'checked' : ''} onchange="appState.calendarShowDoneTodos=this.checked; openCalendarModal(false)" /> Done To-Dos</label>
      </div>
    </div>
    <div class="cal-layout">
      <div>
        <div class="cal-weekdays">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w => `<div class="cal-weekday">${w}</div>`).join('')}
        </div>
        <div class="cal-grid">${gridHtml}</div>
      </div>
      <div class="cal-detail-panel">
        <div class="between">
          <div>
            <strong>${esc(selDateHeading)}</strong>
            <div class="muted">${selBucket.tasks.length} task(s) · ${selBucket.todos.length} reminder(s)</div>
          </div>
          <div class="row" style="gap:6px;">
            <button class="btn-sm" onclick="closeModal(); openTodoModal(null, ${selMillis})">${iconSvg('plus')} Reminder</button>
            <button class="btn-primary btn-sm" onclick="closeModal(); openTaskModal(null, null, ${selMillis})">${iconSvg('plus')} Task</button>
          </div>
        </div>
        ${detailHtml}
      </div>
    </div>`;

  openModal('Maintenance & Reminder Deadline Calendar', bodyHtml, '', true);
}

function shiftCalendarMonth(delta) {
  let y = appState.calendarYear;
  let m = appState.calendarMonth + delta;
  if (m < 0) { m = 11; y -= 1; }
  if (m > 11) { m = 0; y += 1; }
  appState.calendarYear = y;
  appState.calendarMonth = m;
  openCalendarModal(false);
}

function openModal(title, bodyHtml, footerHtml, large = false) {
  const modalBox = document.querySelector('#modal-backdrop .modal');
  if (modalBox) modalBox.classList.toggle('modal-lg', Boolean(large));
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()">Cancel</button>` + footerHtml;
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('modal-backdrop')?.classList.contains('open')) {
    e.preventDefault();
    closeModal();
  }
});

refreshState();

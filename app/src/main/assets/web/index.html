<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MachinaLog — PC Web Portal</title>
  <style>
    :root {
      --bg: #f3f6f9;
      --surface: #ffffff;
      --surface-alt: #eef2f6;
      --border: #d5dee8;
      --text: #102030;
      --muted: #52657a;
      --primary: #1b4965;
      --primary-fg: #ffffff;
      --primary-soft: #dcebf7;
      --ok: #137a47;
      --ok-soft: #daf4e6;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0d151e;
      --surface: #15212e;
      --surface-alt: #1b2a3a;
      --border: #2a3c4f;
      --text: #e6eef7;
      --muted: #93a7bd;
      --primary: #5aa9e6;
      --primary-fg: #071926;
      --primary-soft: #1a354b;
      --ok: #34d399;
      --ok-soft: #0d3326;
      --warn: #fbbf24;
      --warn-soft: #3b2a0b;
      --danger: #f87171;
      --danger-soft: #3d1417;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 860px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 10px; }
      .nav-list { flex-direction: row !important; }
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary); color: var(--primary-fg);
      display: grid; place-items: center;
      font-weight: 800; font-family: var(--mono);
    }
    .brand h1 { font-size: 16px; margin: 0; }
    .brand small { color: var(--muted); font-size: 11px; display: block; }
    .nav-list { display: flex; flex-direction: column; gap: 6px; }
    .nav-btn {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid transparent; background: transparent; color: var(--text);
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; text-align: left;
    }
    .nav-btn:hover { background: var(--surface-alt); }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); border-color: var(--border); }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .kpi-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; padding: 16px 22px 0;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .kpi .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .kpi .val { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .content { padding: 16px 22px 48px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .grid-split { display: grid; grid-template-columns: 360px 1fr; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .grid-split { grid-template-columns: 1fr; } }
    button, .btn {
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      padding: 8px 13px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
    }
    button:hover:not(:disabled) { background: var(--surface-alt); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.52; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--primary); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
    .btn-sm { padding: 5px 9px; font-size: 12px; }
    .icon-btn {
      width: 32px; height: 32px; padding: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .icon-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .icon-btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .icon-btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--primary); }
    .icon-btn.danger { color: var(--danger); border-color: rgba(185,28,28,0.38); }
    .icon-btn.danger:hover:not(:disabled) { background: var(--danger-soft); }
    .icon-btn.ok { color: var(--ok); border-color: rgba(19,122,71,0.38); }
    .icon-btn.ok:hover:not(:disabled) { background: var(--ok-soft); }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
      border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-alt); color: var(--text);
      white-space: nowrap;
    }
    .pill-btn.info { background: var(--primary-soft); color: var(--primary); border-color: rgba(27,73,101,0.28); }
    .pill-btn.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(19,122,71,0.28); }
    .net-busy-track {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100;
      background: transparent; pointer-events: none; overflow: hidden;
    }
    .net-busy-bar {
      height: 100%; width: 35%; background: var(--primary);
      display: none; animation: machina-progress 1.1s infinite ease-in-out;
    }
    .net-busy-track.active .net-busy-bar { display: block; }
    @keyframes machina-progress {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }
    .net-busy-pill {
      display: none; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 600;
    }
    .net-busy-pill.active { display: inline-flex; }
    .spinner {
      width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent;
      border-radius: 50%; animation: machina-spin 0.7s linear infinite;
    }
    @keyframes machina-spin { to { transform: rotate(360deg); } }
    input, select, textarea {
      font-family: var(--sans); font-size: 13px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; width: 100%;
    }
    label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
    .pill {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700; font-family: var(--mono); letter-spacing: .02em;
      background: var(--surface-alt); color: var(--text);
    }
    .pill-primary { background: var(--primary-soft); color: var(--primary); }
    .pill-ok { background: var(--ok-soft); color: var(--ok); }
    .pill-warn { background: var(--warn-soft); color: var(--warn); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
    .chip {
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
    }
    .chip.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .subtabs-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .subtabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .subtab {
      padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 700; white-space: nowrap;
      border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); cursor: pointer;
    }
    .subtab.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-std {
      min-width: 148px; height: 36px; padding: 0 14px; white-space: nowrap; flex-shrink: 0;
    }
    .filter-bar {
      display: grid;
      grid-template-columns: minmax(210px, 1.4fr) repeat(5, minmax(125px, 1fr)) auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .filter-bar input, .filter-bar select { height: 36px; padding: 6px 10px; }
    .filter-check {
      display: inline-flex; align-items: center; gap: 6px; margin: 0; cursor: pointer;
      white-space: nowrap; height: 36px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface-alt);
      font-size: 12px; font-weight: 600; color: var(--text);
    }
    .filter-check input { width: auto; height: auto; margin: 0; padding: 0; }
    @media (max-width: 1120px) {
      .filter-bar { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    }
    .pagination-bar {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .pagination-info {
      display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .pagination-nav {
      display: inline-flex; align-items: center; gap: 8px; flex-wrap: nowrap; white-space: nowrap;
    }
    .pagination-nav button { white-space: nowrap; min-width: 72px; }
    .page-badge {
      padding: 4px 10px; border-radius: 999px; background: var(--surface-alt);
      border: 1px solid var(--border); font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .page-size-select {
      width: auto !important; min-width: 74px; padding: 4px 8px !important; height: 30px; font-weight: 600;
    }
    .checkbox-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface-alt); max-height: 150px; overflow-y: auto;
    }
    .checkbox-pill {
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      color: var(--text); margin: 0; cursor: pointer; padding: 4px 6px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    }
    .checkbox-pill input { width: auto; margin: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; color: var(--muted); background: var(--surface-alt); }
    th.sortable-th { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable-th:hover { color: var(--primary); background: var(--primary-soft); }
    th.sortable-th .sort-ind { margin-left: 4px; font-size: 10px; opacity: 0.85; }
    tr.group-row td {
      background: var(--surface-alt); font-weight: 700; font-size: 13px;
      cursor: pointer; border-top: 2px solid var(--border); border-bottom: 1px solid var(--border);
    }
    tr.group-row.completed-group td {
      background: var(--ok-soft); color: var(--ok); border-top: 2px solid var(--ok);
    }
    tr.group-row:hover td { background: var(--primary-soft); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(6, 14, 24, 0.58);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal.modal-lg { max-width: 1080px; }
    .cal-layout {
      display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start;
    }
    @media (max-width: 860px) { .cal-layout { grid-template-columns: 1fr; } }
    .cal-weekdays, .cal-grid {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;
    }
    .cal-weekday {
      text-align: center; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; padding: 4px 0;
    }
    .cal-cell {
      min-height: 76px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--surface); padding: 6px; cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
      transition: border-color .12s ease, background .12s ease;
    }
    .cal-cell:hover { background: var(--surface-alt); }
    .cal-cell.blank { border-color: transparent; background: transparent; cursor: default; pointer-events: none; }
    .cal-cell.today { border-color: var(--ok); }
    .cal-cell.overdue { background: var(--danger-soft); border-color: rgba(185,28,28,0.45); }
    .cal-cell.selected { background: var(--primary-soft); border: 2px solid var(--primary); }
    .cal-day-num { font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .cal-tags { display: flex; flex-direction: column; gap: 2px; }
    .cal-tag {
      font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cal-tag.task { background: var(--primary); color: var(--primary-fg); }
    .cal-tag.task.late { background: var(--danger); color: #fff; }
    .cal-tag.todo { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(180,83,9,0.28); }
    .cal-detail-panel {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      background: var(--surface-alt); max-height: 62vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .picker-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .picker-item {
      padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .picker-item:hover { background: var(--surface-alt); }
    .picker-item.selected { background: var(--primary-soft); border-left: 3px solid var(--primary); }
    .eng-modal-banner {
      border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .eng-modal-banner.active-mode { background: var(--primary-soft); border: 1.5px solid var(--primary); color: var(--primary); }
    .eng-modal-banner.history-mode { background: var(--ok-soft); border: 1.5px solid var(--ok); color: var(--ok); }
    .eng-modal-card {
      border-radius: 10px; padding: 11px 12px; background: var(--surface);
    }
    .eng-modal-card.active-card { border: 1.5px solid var(--primary); }
    .eng-modal-card.history-card { border: 1.5px solid var(--ok); }
    .eng-modal-card.alert-card { border: 1.5px solid var(--danger); }
    .toast {
      position: fixed; right: 20px; bottom: 20px; background: var(--primary); color: var(--primary-fg);
      padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; z-index: 80;
      display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<div class="net-busy-track" id="net-busy-track"><div class="net-busy-bar"></div></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ML</div>
      <div>
        <h1>MachinaLog</h1>
        <small>PC LAN Web Portal</small>
      </div>
    </div>
    <div class="nav-list">
      <button class="nav-btn active" data-tab="tasks" onclick="switchTab('tasks')">Tasks &amp; To-Do <span class="pill" id="nav-badge-tasks">0</span></button>
      <button class="nav-btn" data-tab="machines" onclick="switchTab('machines')">Machines <span class="pill" id="nav-badge-machines">0</span></button>
      <button class="nav-btn" data-tab="warehouse" onclick="switchTab('warehouse')">Warehouse Parts <span class="pill" id="nav-badge-parts">0</span></button>
      <button class="nav-btn" data-tab="suppliers" onclick="switchTab('suppliers')">Suppliers <span class="pill" id="nav-badge-suppliers">0</span></button>
      <button class="nav-btn" data-tab="engineers" onclick="switchTab('engineers')">Engineers <span class="pill" id="nav-badge-engineers">0</span></button>
      <button class="nav-btn" data-tab="reports" onclick="switchTab('reports')">Reports</button>
      <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">Settings</button>
    </div>
    <div id="sidebar-version" class="muted" style="margin-top:auto; padding: 6px;">
      MachinaLog
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="row">
        <strong id="page-title">Tasks, To-Dos &amp; History</strong>
        <span id="conn-pill" class="pill pill-ok">ONLINE</span>
        <span id="net-busy-pill" class="net-busy-pill"><span class="spinner"></span><span id="net-busy-text">Working...</span></span>
      </div>
      <div class="row">
        <button class="btn" title="Open Deadline Calendar" onclick="openCalendarModal()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </button>
        <button class="btn-primary" title="Create New Maintenance Task" onclick="openTaskModal()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New Task
        </button>
        <button class="icon-btn" title="Refresh Live Data" aria-label="Refresh Live Data" onclick="refreshState()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" title="Toggle Dark / Light Theme" aria-label="Toggle Theme" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        </button>
      </div>
    </header>

    <section class="kpi-strip" id="top-kpi-strip"></section>

    <section class="content" id="view-root"></section>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <strong id="modal-title">Modal</strong>
      <button class="icon-btn" title="Close" aria-label="Close modal" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<input type="file" id="quick-upload-xlsx" accept=".xlsx" style="display:none" onchange="handleQuickExcelUpload(this)" />
<div class="toast" id="toast"></div>

<script>
const appState = {
  data: null,
  tab: 'tasks',
  taskSubTab: 'active',
  pin: localStorage.getItem('machina_pin') || '',
  isOnline: true,
  busyCount: 0,
  taskCadence: 'ALL',
  taskPriority: 'ALL',
  taskPic: 'ALL',
  taskGroupId: 'ALL',
  taskGroupBy: 'CUSTOM_GROUP',
  collapsedTaskGroups: {},
  taskOverdueOnly: false,
  taskSearch: '',
  todoRepeat: 'ALL',
  todoPriority: 'ALL',
  todoPic: 'ALL',
  todoGroupId: 'ALL',
  todoGroupBy: 'SOURCE',
  collapsedTodoGroups: {},
  todoSearch: '',
  todoShowDone: false,
  historyOutcome: 'ALL',
  historyPriority: 'ALL',
  historyCadence: 'ALL',
  historyPic: 'ALL',
  historyGroupId: 'ALL',
  historyGroupBy: 'CUSTOM_GROUP',
  collapsedHistoryGroups: {},

function setConnStatus(online, customLabel = null) {
  appState.isOnline = Boolean(online);
  const el = document.getElementById('conn-pill');
  if (!el) return;
  if (online) {
    el.className = 'pill pill-ok';
    el.textContent = customLabel || 'ONLINE';
  } else {
    el.className = 'pill pill-danger';
    el.textContent = customLabel || 'OFFLINE · Reconnecting...';
  }
}

function setNetBusy(active, label = 'Working...') {
  appState.busyCount = Math.max(0, appState.busyCount + (active ? 1 : -1));
  const track = document.getElementById('net-busy-track');
  const pill = document.getElementById('net-busy-pill');
  const txt = document.getElementById('net-busy-text');
  if (appState.busyCount > 0) {
    if (track) track.classList.add('active');
    if (pill) pill.classList.add('active');
    if (txt && label) txt.textContent = label;
  } else {
    if (track) track.classList.remove('active');
    if (pill) pill.classList.remove('active');
  }
}

async function withBusy(label, asyncFn, btnEl = null) {
  if (btnEl) btnEl.disabled = true;
  setNetBusy(true, label);
  try {
    return await asyncFn();
  } catch (e) {
    if (e.message !== 'PIN required') showToast('Error: ' + e.message);
    throw e;
  } finally {
    setNetBusy(false);
    if (btnEl) btnEl.disabled = false;
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('machina_theme', next);
}
if (localStorage.getItem('machina_theme') === 'dark' ||
    (!localStorage.getItem('machina_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.setAttribute('data-theme', 'dark');
}

async function apiFetch(path, options = {}) {
  const headers = Object.assign({}, options.headers || {});
  if (appState.pin) headers['X-Machina-Pin'] = appState.pin;
  let resp;
  try {
    resp = await fetch(path, Object.assign({}, options, { headers }));
  } catch (networkErr) {
    setConnStatus(false, 'OFFLINE · Unreachable');
    throw networkErr;
  }
  setConnStatus(true);
  if (resp.status === 401) {
    promptPinModal();
    throw new Error('PIN required');
  }
  return resp;
}

async function apiJson(path, method = 'GET', bodyObj = null) {
  const opts = { method, headers: {} };
  if (bodyObj !== null) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(bodyObj);
  }
  const resp = await apiFetch(path, opts);
  const json = await resp.json();
  if (!resp.ok || json.ok === false) throw new Error(json.message || 'Request failed');
  return json;
}

function promptPinModal() {
  openModal('Enter Device PIN', `
    <p class="muted">This Android device requires a PIN to access MachinaLog over Wi-Fi.</p>
    <div><label>PIN Code</label><input id="pin-input" type="password" placeholder="Enter 4-digit PIN" /></div>
  `, `<button class="btn-primary" onclick="submitPin()">Unlock</button>`);
}

function submitPin() {
  appState.pin = document.getElementById('pin-input').value.trim();
  localStorage.setItem('machina_pin', appState.pin);
  closeModal();
  refreshState();
}

async function refreshState(silent = false) {
  if (!silent) setNetBusy(true, 'Syncing...');
  try {
    const data = await apiJson('/api/state');
    appState.data = data;
    if (!appState.selectedMachineId && data.machines.length) {
      appState.selectedMachineId = data.machines[0].id;
    }
    setConnStatus(true);
    updateKpis();
    renderTab();
  } catch (e) {
    if (e.message !== 'PIN required' && !silent) showToast('Error: ' + e.message);
  } finally {
    if (!silent) setNetBusy(false);
  }
}

async function pingHeartbeat() {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3500);
    const resp = await fetch('/api/ping', {
      headers: appState.pin ? { 'X-Machina-Pin': appState.pin } : {},
      signal: controller.signal
    });
    clearTimeout(timer);
    if (resp.ok) {
      const wasOffline = !appState.isOnline;
      setConnStatus(true);
      if (wasOffline) refreshState(true);
    } else {
      setConnStatus(false, 'OFFLINE · Reconnecting...');
    }
  } catch (_) {
    setConnStatus(false, 'OFFLINE · Reconnecting...');
  }
}
window.addEventListener('online', () => { pingHeartbeat(); });
window.addEventListener('offline', () => { setConnStatus(false, 'OFFLINE · Network down'); });
setInterval(pingHeartbeat, 15000);

function buildTodoFeedList(d) {
  const mMap = byIdMap(d.machines);
  const standalone = (d.todos || []).map(td => ({
    kind: 'TODO',
    id: td.id,
    title: td.title || '',
    notes: td.notes || '',
    repeatLabel: td.repeatRule || 'ONCE',
    priority: td.priority || 'NORMAL',
    machineId: td.machineId || null,
    groupId: td.groupId || (td.machineId && mMap[td.machineId] ? mMap[td.machineId].groupId : null),
    personInCharge: td.personInCharge || '',
    assistantEngineers: '',
    createdAtMillis: td.createdAtMillis || td.dueAtMillis || 0,
    triggerAtMillis: td.dueAtMillis || 0,
    dueAtMillis: td.dueAtMillis || 0,
    isCompleted: Boolean(td.isCompleted),
    completedAtMillis: td.completedAtMillis || null,
    reminderEnabled: Boolean(td.reminderEnabled),
    raw: td
  }));
  const linked = (d.tasks || []).filter(t => t.reminderEnabled).map(t => {
    const leadHrs = Math.max(1, Number(t.reminderLeadHours) || 24);
    const triggerAt = (t.deadlineMillis || 0) - leadHrs * 3600 * 1000;
    return {
      kind: 'TASK',
      id: t.id,
      title: t.title || '',
      notes: t.description || '',
      repeatLabel: t.cadence || 'ONCE',
      priority: t.priority || 'NORMAL',
      machineId: t.machineId,
      groupId: t.groupId || (mMap[t.machineId] ? mMap[t.machineId].groupId : null),
      personInCharge: t.personInCharge || '',
      assistantEngineers: t.assistantEngineers || '',
      createdAtMillis: t.createdAtMillis || 0,
      triggerAtMillis: triggerAt,
      dueAtMillis: t.deadlineMillis || 0,
      isCompleted: false,
      completedAtMillis: null,
      reminderEnabled: true,
      raw: t
    };
  });
  return standalone.concat(linked);
}

function isTaskApproachingOrOverdue(t, now) {
  if (t.deadlineMillis < now) return true;
  const remaining = t.deadlineMillis - now;
  if (remaining <= 24 * 3600 * 1000) return true;
  if (t.reminderEnabled) {
    const leadMs = Math.max(1, Number(t.reminderLeadHours) || 24) * 3600 * 1000;
    if (remaining <= leadMs) return true;
  }
  return false;
}

function renderTopKpis() {
  const strip = document.getElementById('top-kpi-strip');
  const d = appState.data;
  if (!strip || !d) return;
  const now = Date.now();
  let cards = [];

  if (appState.tab === 'tasks' && appState.taskSubTab === 'active') {
    const total = d.tasks.length;
    const overdue = d.tasks.filter(t => t.deadlineMillis < now).length;
    const openOnSchedule = d.tasks.filter(t => t.deadlineMillis >= now).length;
    const approaching = d.tasks.filter(t => {
      if (t.deadlineMillis < now) return false;
      const leadMs = Math.max(1, Number(t.reminderLeadHours) || 24) * 3600 * 1000;
      return (t.deadlineMillis - now <= 24 * 3600 * 1000) || (t.reminderEnabled && (t.deadlineMillis - leadMs <= now));
    }).length;
    cards = [
      { lbl: 'Total Tasks', val: total, color: '' },
      { lbl: 'Open Tasks', val: openOnSchedule, color: 'var(--primary)' },
      { lbl: 'Overdue Tasks', val: overdue, color: overdue > 0 ? 'var(--danger)' : 'var(--ok)' },
      { lbl: 'Approaching Deadline', val: approaching, color: approaching > 0 ? 'var(--warn)' : '' }
    ];
  } else if (appState.tab === 'tasks' && appState.taskSubTab === 'todos') {
    const feed = buildTodoFeedList(d);
    const openList = feed.filter(x => !x.isCompleted);
    const overdue = openList.filter(x => x.dueAtMillis < now).length;
    const openOnSchedule = openList.filter(x => x.dueAtMillis >= now).length;
    const approaching = openList.filter(x => x.dueAtMillis >= now && (x.triggerAtMillis <= now || (x.dueAtMillis - now <= 24 * 3600 * 1000))).length;
    cards = [
      { lbl: 'Total To-Dos', val: feed.length, color: '' },
      { lbl: 'Open To-Dos', val: openOnSchedule, color: 'var(--primary)' },
      { lbl: 'Overdue To-Dos', val: overdue, color: overdue > 0 ? 'var(--danger)' : 'var(--ok)' },
      { lbl: 'Approaching Deadline', val: approaching, color: approaching > 0 ? 'var(--warn)' : '' }
    ];
  } else if (appState.tab === 'tasks' && appState.taskSubTab === 'history') {
    const total = d.serviceLogs.length;
    const done = d.serviceLogs.filter(l => l.outcome === 'DONE').length;
    const rejected = d.serviceLogs.filter(l => l.outcome === 'REJECTED').length;
    const totalMins = d.serviceLogs.reduce((acc, l) => acc + (Number(l.serviceDurationMinutes) || 0), 0);
    cards = [
      { lbl: 'History Records', val: total, color: '' },
      { lbl: 'Completed (Done)', val: done, color: 'var(--ok)' },
      { lbl: 'Rejected', val: rejected, color: rejected > 0 ? 'var(--danger)' : '' },
      { lbl: 'Service Hours Logged', val: (Math.round((totalMins / 60) * 10) / 10) + 'h', color: 'var(--primary)' }
    ];
  } else if (appState.tab === 'machines') {
    const operational = d.machines.filter(m => m.status === 'OPERATIONAL').length;
    const maintDue = d.machines.filter(m => m.status === 'MAINTENANCE_DUE').length;
    const malfunction = d.machines.filter(m => m.status === 'MALFUNCTION').length;
    cards = [
      { lbl: 'Total Machines', val: d.machines.length, color: '' },
      { lbl: 'Operational', val: operational, color: 'var(--ok)' },
      { lbl: 'Maintenance Due', val: maintDue, color: maintDue > 0 ? 'var(--warn)' : '' },
      { lbl: 'Malfunction', val: malfunction, color: malfunction > 0 ? 'var(--danger)' : '' }
    ];
  } else if (appState.tab === 'warehouse') {
    const usageCount = d.serviceLogs.reduce((acc, l) => acc + ((l.parts || []).length), 0);
    const linkedSuppliers = d.warehouseParts.filter(w => w.supplierId).length;
    cards = [
      { lbl: 'Warehouse Spare Parts', val: d.warehouseParts.length, color: 'var(--primary)' },
      { lbl: 'Supplier-Linked Parts', val: linkedSuppliers, color: 'var(--ok)' },
      { lbl: 'Historical Part Uses', val: usageCount, color: '' }
    ];
  } else if (appState.tab === 'suppliers') {
    const sups = d.suppliers || [];
    const linked = d.warehouseParts.filter(w => w.supplierId).length;
    cards = [
      { lbl: 'Configured Suppliers', val: sups.length, color: 'var(--primary)' },
      { lbl: 'Supplied Catalog Parts', val: linked, color: 'var(--ok)' },
      { lbl: 'Unassigned Parts', val: Math.max(0, d.warehouseParts.length - linked), color: 'var(--warn)' }
    ];
  } else if (appState.tab === 'engineers') {
    const engs = d.engineers || [];
    const done = d.serviceLogs.filter(l => l.outcome === 'DONE').length;
    cards = [
      { lbl: 'Registered Engineers', val: engs.length, color: 'var(--primary)' },
      { lbl: 'Active Task Assignments', val: d.tasks.length, color: 'var(--warn)' },
      { lbl: 'Historical Jobs Done', val: done, color: 'var(--ok)' }
    ];
  } else if (appState.tab === 'reports') {
    const done = d.serviceLogs.filter(l => l.outcome === 'DONE').length;
    const rejected = d.serviceLogs.filter(l => l.outcome === 'REJECTED').length;
    const partsUsed = d.serviceLogs.reduce((acc, l) => acc + (l.parts || []).reduce((s, p) => s + (Number(p.quantity) || 0), 0), 0);
    cards = [
      { lbl: 'Total Reports', val: d.serviceLogs.length, color: 'var(--primary)' },
      { lbl: 'Done', val: done, color: 'var(--ok)' },
      { lbl: 'Rejected', val: rejected, color: rejected > 0 ? 'var(--danger)' : '' },
      { lbl: 'Spare Parts Used', val: partsUsed, color: '' }
    ];
  } else {
    cards = [
      { lbl: 'Active Tasks', val: d.tasks.length, color: '' },
      { lbl: 'Machines', val: d.machines.length, color: '' },
      { lbl: 'Custom Groups', val: d.groups.length, color: 'var(--primary)' },
      { lbl: 'App Version', val: 'v' + (d.appVersionName || '1.0'), color: '' }
    ];
  }

  strip.innerHTML = cards.map(c =>
    `<div class="kpi"><div class="lbl">${esc(c.lbl)}</div><div class="val" ${c.color ? `style="color:${c.color}"` : ''}>${esc(c.val)}</div></div>`
  ).join('');
}

function updateKpis() {
  const d = appState.data;
  if (!d) return;
  const now = Date.now();
  const urgentTaskCount = d.tasks.filter(t => isTaskApproachingOrOverdue(t, now)).length;
  const engineersCount = (d.engineers || []).length;
  const suppliersCount = (d.suppliers || []).length;

  document.getElementById('nav-badge-tasks').textContent = urgentTaskCount;
  document.getElementById('nav-badge-machines').textContent = d.machines.length;
  document.getElementById('nav-badge-parts').textContent = d.warehouseParts.length;
  const supBadge = document.getElementById('nav-badge-suppliers');
  if (supBadge) supBadge.textContent = suppliersCount;
  document.getElementById('nav-badge-engineers').textContent = engineersCount;

  if (verEl) {
    verEl.textContent = `MachinaLog v${d.appVersionName || '1.0'} (Build ${d.appVersionCode || 1})`;
  }
  renderTopKpis();
}

function fmtDate(ms) {
  if (!ms) return '-';
  return new Date(ms).toLocaleString([], { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function toInputDateTime(ms) {
  const dt = new Date(ms || Date.now());
  const pad = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

function formatLeadTime(hours) {
  const h = Math.max(1, Number(hours) || 24);
  if (h >= 24 && h % 24 === 0) {
    const days = h / 24;
    return days === 1 ? '1 day' : `${days} days`;
  }
  return h === 1 ? '1 hour' : `${h} hours`;
}

function parseEngineerList(raw) {
  if (!raw) return [];
  return String(raw).split(',').map(s => s.trim()).filter(Boolean);
}

function byIdMap(list) {
  const m = {};
  (list || []).forEach(x => m[x.id] = x);
  return m;
}

function statusPillHtml(status) {
  if (status === 'MALFUNCTION') return `<span class="pill pill-danger">MALFUNCTION</span>`;
  if (status === 'MAINTENANCE_DUE') return `<span class="pill pill-warn">MAINT. DUE</span>`;
  return `<span class="pill pill-ok">OPERATIONAL</span>`;
}

function outcomePillHtml(outcome) {
  if (outcome === 'REJECTED') return `<span class="pill pill-danger">REJECTED</span>`;
  return `<span class="pill pill-ok">DONE</span>`;
}

function priorityPillHtml(priority) {
  const p = String(priority || 'NORMAL').toUpperCase();
  if (p === 'URGENT') return `<span class="pill pill-danger">URGENT</span>`;
  if (p === 'HIGH') return `<span class="pill pill-warn">HIGH</span>`;
  return `<span class="pill">NORMAL</span>`;
}

function buildEngineerSelectHtml(idAttr, engineers, preferredName, onchangeAttr = '') {
  if (!engineers || engineers.length === 0) {
    return `<select id="${idAttr}" ${onchangeAttr}><option value="">No registered engineers — add one in Engineers tab</option></select>`;
  }
  const match = engineers.find(e => e.name.toLowerCase() === String(preferredName || '').trim().toLowerCase());
  const selectedName = match ? match.name : engineers[0].name;
  return `<select id="${idAttr}" ${onchangeAttr}>${engineers.map(e =>
    `<option value="${esc(e.name)}" ${e.name === selectedName ? 'selected' : ''}>${esc(e.name)}${e.employeeCode ? ' (' + esc(e.employeeCode) + ')' : ''}</option>`
  ).join('')}</select>`;
}

function renderAssistantCheckboxesHtml(prefix, engineers, excludePic, selectedNames) {
  const candidates = (engineers || []).filter(e => e.name.toLowerCase() !== String(excludePic || '').trim().toLowerCase());
  if (candidates.length === 0) {
    return `<div class="muted">No additional engineers available. Add more crew in the Engineers tab if needed.</div>`;
  }
  const selectedLower = new Set((selectedNames || []).map(s => s.toLowerCase()));
  return candidates.map(e => `
    <label class="checkbox-pill">
      <input type="checkbox" value="${esc(e.name)}" ${selectedLower.has(e.name.toLowerCase()) ? 'checked' : ''} />
      <span>${esc(e.name)}</span>
    </label>
  `).join('');
}

function syncAssistantBox(prefix) {
  const picEl = document.getElementById(`${prefix}-pic`);
  const boxEl = document.getElementById(`${prefix}-assistants-box`);
  if (!picEl || !boxEl) return;
  const currentlyChecked = Array.from(boxEl.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
  boxEl.innerHTML = renderAssistantCheckboxesHtml(prefix, appState.data.engineers || [], picEl.value, currentlyChecked);
}

function getCheckedAssistants(prefix) {
  const pic = document.getElementById(`${prefix}-pic`)?.value || '';
  const boxEl = document.getElementById(`${prefix}-assistants-box`);
  if (!boxEl) return [];
  return Array.from(boxEl.querySelectorAll('input[type="checkbox"]:checked'))
    .map(cb => cb.value)
    .filter(name => name.toLowerCase() !== pic.toLowerCase());
}

function toggleColSort(section, key) {
  const cur = appState.colSorts[section] || { key, dir: 'ASC' };
  if (cur.key === key) {
    cur.dir = cur.dir === 'ASC' ? 'DESC' : 'ASC';
  } else {
    cur.key = key;
    cur.dir = (key === 'recorded' || key === 'created') ? 'DESC' : 'ASC';
  }
  appState.colSorts[section] = cur;
  renderTab();
}

function sortableTh(section, key, label) {
  const cur = appState.colSorts[section];
  const active = cur && cur.key === key;
  const ind = active ? (cur.dir === 'ASC' ? '▲' : '▼') : '⇅';
  return `<th class="sortable-th" title="Click to sort by ${esc(label)}" onclick="toggleColSort('${section}','${key}')">${esc(label)}<span class="sort-ind">${ind}</span></th>`;
}

function priorityRank(p) {
  const u = String(p || 'NORMAL').toUpperCase();
  if (u === 'URGENT') return 3;
  if (u === 'HIGH') return 2;
  return 1;
}

function cmpValues(a, b, dir) {
  let res = 0;
  if (typeof a === 'number' && typeof b === 'number') {
    res = a - b;
  } else {
    res = String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base', numeric: true });
  }
  return dir === 'DESC' ? -res : res;
}

function paginateWeb(items, section) {
  const size = [25, 50, 100].includes(appState.pageSize) ? appState.pageSize : 25;
  const total = items.length;
  if (total === 0) {
    appState.pages[section] = 0;
    return { items: [], safePage: 0, totalPages: 1, total: 0, start: 0, end: 0, size };
  }
  const totalPages = Math.max(1, Math.ceil(total / size));
  const rawPage = Number(appState.pages[section]) || 0;
  const safePage = Math.max(0, Math.min(rawPage, totalPages - 1));
  appState.pages[section] = safePage;
  const startIdx = safePage * size;
  const slice = items.slice(startIdx, startIdx + size);
  return {
    items: slice,
    safePage,
    totalPages,
    total,
    start: startIdx + 1,
    end: Math.min(startIdx + size, total),
    size
  };
}

function paginationBarHtml(paged, section, rerenderExpr = 'renderTab()') {
  if (!paged || paged.total === 0) return '';
  return `
    <div class="pagination-bar">
      <div class="pagination-info">
        <span class="muted">Showing <strong>${paged.start}–${paged.end}</strong> of <strong>${paged.total}</strong></span>
        <label style="display:inline-flex;align-items:center;gap:6px;margin:0;white-space:nowrap;">
          <span>Per page:</span>
          <select class="page-size-select" onchange="appState.pageSize=Number(this.value); appState.pages['${section}']=0; ${rerenderExpr}">
            ${[25, 50, 100].map(sz => `<option value="${sz}" ${paged.size===sz?'selected':''}>${sz}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="pagination-nav">
        <button class="btn-sm" ${paged.safePage <= 0 ? 'disabled' : ''} onclick="appState.pages['${section}']=Math.max(0, ${paged.safePage} - 1); ${rerenderExpr}">&laquo; Prev</button>
        <span class="page-badge">Page ${paged.safePage + 1} / ${paged.totalPages}</span>
        <button class="btn-sm" ${paged.safePage >= paged.totalPages - 1 ? 'disabled' : ''} onclick="appState.pages['${section}']=Math.min(${paged.totalPages - 1}, ${paged.safePage} + 1); ${rerenderExpr}">Next &raquo;</button>
      </div>
    </div>`;
}

function renderTab() {
  const d = appState.data;
  if (!d) return;
  renderTopKpis();
  const root = document.getElementById('view-root');
  if (appState.tab === 'tasks') renderTasks(root, d);
  else if (appState.tab === 'machines') renderMachines(root, d);
  else if (appState.tab === 'warehouse') renderWarehouse(root, d);
  else if (appState.tab === 'suppliers') renderSuppliers(root, d);
  else if (appState.tab === 'engineers') renderEngineers(root, d);
  else if (appState.tab === 'reports') renderReports(root, d);
  else if (appState.tab === 'settings') renderSettings(root, d);
}

// --- 1. UNIFIED TASKS, TO-DO REMINDERS & HISTORY ---
function renderTasks(root, d) {
  const openTodosCount = (d.todos || []).filter(td => !td.isCompleted).length + (d.tasks || []).filter(t => t.reminderEnabled).length;
  const subtabActionHtml = appState.taskSubTab === 'todos'
    ? `<button class="btn-primary btn-std" title="Create New Reminder" onclick="openTodoModal()">${iconSvg('plus')} New Reminder</button>`
    : `<button class="btn btn-std" title="Import Excel (.xlsx)" onclick="triggerQuickExcelImport()">${iconSvg('upload')} Import Excel</button>
       <button class="btn-primary btn-std" title="Create New Maintenance Task" onclick="openTaskModal()">${iconSvg('plus')} New Task</button>`;

  const subtabsHtml = `
    <div class="subtabs-bar">
      <div class="subtabs" style="border-bottom:none;padding-bottom:0;margin-bottom:0;">
        <button class="subtab ${appState.taskSubTab==='active'?'active':''}" onclick="appState.taskSubTab='active'; renderTab()">Active Tasks (${d.tasks.length})</button>
        <button class="subtab ${appState.taskSubTab==='todos'?'active':''}" onclick="appState.taskSubTab='todos'; renderTab()">To-Do Reminders (${openTodosCount})</button>
        <button class="subtab ${appState.taskSubTab==='history'?'active':''}" onclick="appState.taskSubTab='history'; renderTab()">Task History (${d.serviceLogs.length})</button>
      </div>
      <div class="toolbar-actions">
        ${subtabActionHtml}
      </div>
    </div>`;

  if (appState.taskSubTab === 'todos') {
    root.innerHTML = `<div class="card">${subtabsHtml}${renderTodoSubTabHtml(d)}</div>`;
    return;
  }
  if (appState.taskSubTab === 'history') {
    root.innerHTML = `<div class="card">${subtabsHtml}${renderHistorySubTabHtml(d)}</div>`;
    return;
  }

  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const now = Date.now();
  const q = appState.taskSearch.trim().toLowerCase();
  const picNames = [...new Set((d.engineers || []).map(e => e.name).concat(d.tasks.map(t => t.personInCharge)).filter(Boolean))].sort();
  const tSort = appState.colSorts.tasks || { key: 'deadline', dir: 'ASC' };

  const filtered = d.tasks.filter(t => {
    const m = mMap[t.machineId];
    const effGroupId = t.groupId || m?.groupId || null;
    if (appState.taskCadence !== 'ALL' && t.cadence !== appState.taskCadence) return false;
    if (appState.taskPriority !== 'ALL' && (t.priority || 'NORMAL') !== appState.taskPriority) return false;
    if (appState.taskGroupId !== 'ALL' && String(effGroupId || '') !== String(appState.taskGroupId)) return false;
    if (appState.taskPic !== 'ALL') {
      const picLower = appState.taskPic.toLowerCase();
      const isPic = (t.personInCharge || '').toLowerCase() === picLower;
      const isAst = parseEngineerList(t.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (appState.taskOverdueOnly && t.deadlineMillis >= now) return false;
    if (q) {
      const hay = `${t.title} ${t.description} ${t.priority || 'NORMAL'} ${t.personInCharge} ${t.assistantEngineers || ''} ${m?.assetCode || ''} ${m?.name || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    const mA = mMap[a.machineId];
    const mB = mMap[b.machineId];
    switch (tSort.key) {
      case 'priority': {
        const pr = cmpValues(priorityRank(a.priority), priorityRank(b.priority), tSort.dir);
        return pr !== 0 ? pr : String(a.cadence).localeCompare(String(b.cadence));
      }
      case 'machine':
        return cmpValues(`${mA?.assetCode || ''} ${mA?.name || ''}`, `${mB?.assetCode || ''} ${mB?.name || ''}`, tSort.dir);
      case 'title':
        return cmpValues(a.title, b.title, tSort.dir);
      case 'created':
        return cmpValues(a.createdAtMillis || 0, b.createdAtMillis || 0, tSort.dir);
      case 'pic':
        return cmpValues(a.personInCharge, b.personInCharge, tSort.dir);
      case 'est':
        return cmpValues(Number(a.estimatedMinutes) || 0, Number(b.estimatedMinutes) || 0, tSort.dir);
      case 'deadline':
      default:
        return cmpValues(a.deadlineMillis || 0, b.deadlineMillis || 0, tSort.dir);
    }
  });

  const paged = paginateWeb(filtered, 'tasks');

  // Group paginated rows based on appState.taskGroupBy
  const sections = [];
  if (appState.taskGroupBy === 'NONE') {
    sections.push({ title: 'All Tasks', tasks: paged.items });
  } else {
    const groupBucket = new Map();
    paged.items.forEach(t => {
      const m = mMap[t.machineId];
      let gTitle = 'Ungrouped';
      if (appState.taskGroupBy === 'CADENCE') gTitle = `${t.cadence} Maintenance`;
      else if (appState.taskGroupBy === 'MACHINE') gTitle = m ? `${m.assetCode} · ${m.name}` : 'Unknown Machine';
      else if (appState.taskGroupBy === 'PIC') gTitle = t.personInCharge || 'Unassigned';
      else {
        const effGid = t.groupId || m?.groupId;
        gTitle = effGid && gMap[effGid] ? gMap[effGid].name : 'Ungrouped';
      }
      if (!groupBucket.has(gTitle)) groupBucket.set(gTitle, []);
      groupBucket.get(gTitle).push(t);
    });
    groupBucket.forEach((tasks, title) => sections.push({ title, tasks }));
  }

  const renderTaskRow = (t) => {
    const m = mMap[t.machineId];
    const g = gMap[t.groupId || m?.groupId];
    const overdue = t.deadlineMillis < now;
    return `<tr>
      <td>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          ${priorityPillHtml(t.priority)}
          <span class="pill pill-primary">${esc(t.cadence)}</span>
        </div>
        ${t.cadence!=='ONCE' ? `<div class="muted" style="margin-top:3px;">Auto-repeats</div>`:''}
        ${g ? `<div class="muted" style="margin-top:4px;">${esc(g.name)}</div>` : ''}
      </td>
      <td><strong>${esc(m?.assetCode || '-')}</strong><div class="muted">${esc(m?.name || '')}</div></td>
      <td><strong>${esc(t.title)}</strong><div class="muted">${esc(t.description)}</div></td>
      <td><div class="muted">${fmtDate(t.createdAtMillis)}</div></td>
      <td>
        <span class="pill ${overdue ? 'pill-danger' : 'pill-ok'}">${overdue ? 'OVERDUE' : 'ON SCHEDULE'}</span>
        <div class="muted">${fmtDate(t.deadlineMillis)}</div>
        <div class="muted">${t.reminderEnabled ? `Remind ${esc(formatLeadTime(t.reminderLeadHours))} before` : 'Reminder off'}</div>
      </td>
      <td>
        <strong>${esc(t.personInCharge)}</strong>
        ${t.assistantEngineers ? `<div class="muted">+ ${esc(t.assistantEngineers)}</div>` : ''}
      </td>
      <td>${t.estimatedMinutes}m</td>
      <td>
        <div class="row" style="gap:5px;flex-wrap:nowrap;">
          <button class="icon-btn ok" title="Complete Task & Generate Report" aria-label="Complete Task" onclick="openCompleteTaskModal(${t.id})">${iconSvg('complete')}</button>
          <button class="icon-btn danger" title="Reject Service Request" aria-label="Reject Task" onclick="openRejectTaskModal(${t.id})">${iconSvg('reject')}</button>
          <button class="icon-btn" title="Edit Task" aria-label="Edit Task" onclick="openTaskModal(${t.id})">${iconSvg('edit')}</button>
          <button class="icon-btn danger" title="Delete Task" aria-label="Delete Task" onclick="deleteTask(${t.id}, this)">${iconSvg('del')}</button>
        </div>
      </td>
    </tr>`;
  };

  let tbodyHtml = '';
  if (filtered.length === 0) {
    tbodyHtml = `<tr><td colspan="8" class="muted">No active tasks match the current filter.</td></tr>`;
  } else {
    sections.forEach(sec => {
      if (appState.taskGroupBy !== 'NONE') {
        const collapsed = Boolean(appState.collapsedTaskGroups[sec.title]);
        const secOverdue = sec.tasks.filter(t => t.deadlineMillis < now).length;
        const encodedKey = encodeURIComponent(sec.title);
        tbodyHtml += `<tr class="group-row" onclick="toggleTaskGroupCollapse('${encodedKey}')">
          <td colspan="8">
            <div class="between">
              <span>${collapsed ? '▶' : '▼'} ${esc(sec.title)}</span>
              <div class="row">
                ${secOverdue > 0 ? `<span class="pill pill-danger">${secOverdue} OVERDUE</span>` : ''}
                <span class="pill">${sec.tasks.length}</span>
              </div>
            </div>
          </td>
        </tr>`;
        if (!collapsed) {
          tbodyHtml += sec.tasks.map(renderTaskRow).join('');
        }
      } else {
        tbodyHtml += sec.tasks.map(renderTaskRow).join('');
      }
    });
  }

  root.innerHTML = `
    <div class="card">
      ${subtabsHtml}
      <div class="filter-bar">
        <input placeholder="Search tasks, machine, PIC..." value="${esc(appState.taskSearch)}" oninput="appState.taskSearch=this.value; appState.pages.tasks=0; renderTab()" />
        <select onchange="appState.taskGroupBy=this.value; renderTab()">
          <option value="CUSTOM_GROUP" ${appState.taskGroupBy==='CUSTOM_GROUP'?'selected':''}>Group: Custom Group</option>
          <option value="CADENCE" ${appState.taskGroupBy==='CADENCE'?'selected':''}>Group: Cadence</option>
          <option value="MACHINE" ${appState.taskGroupBy==='MACHINE'?'selected':''}>Group: Machine</option>
          <option value="PIC" ${appState.taskGroupBy==='PIC'?'selected':''}>Group: Engineer</option>
          <option value="NONE" ${appState.taskGroupBy==='NONE'?'selected':''}>Flat List</option>
        </select>
        <select onchange="appState.taskPriority=this.value; appState.pages.tasks=0; renderTab()">
          <option value="ALL" ${appState.taskPriority==='ALL'?'selected':''}>All Priorities</option>
          <option value="URGENT" ${appState.taskPriority==='URGENT'?'selected':''}>URGENT</option>
          <option value="HIGH" ${appState.taskPriority==='HIGH'?'selected':''}>HIGH</option>
          <option value="NORMAL" ${appState.taskPriority==='NORMAL'?'selected':''}>NORMAL</option>
        </select>
        <select onchange="appState.taskCadence=this.value; appState.pages.tasks=0; renderTab()">
          <option value="ALL" ${appState.taskCadence==='ALL'?'selected':''}>All Cadences</option>
          ${['ONCE','DAILY','WEEKLY','MONTHLY','YEARLY'].map(c => `<option value="${c}" ${appState.taskCadence===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select onchange="appState.taskPic=this.value; appState.pages.tasks=0; renderTab()">
          <option value="ALL" ${appState.taskPic==='ALL'?'selected':''}>All Engineers</option>
          ${picNames.map(p => `<option value="${esc(p)}" ${appState.taskPic===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <select onchange="appState.taskGroupId=this.value; appState.pages.tasks=0; renderTab()">
          <option value="ALL" ${appState.taskGroupId==='ALL'?'selected':''}>All Groups</option>
          ${d.groups.map(g => `<option value="${g.id}" ${String(appState.taskGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
        </select>
        <label class="filter-check">
          <input type="checkbox" ${appState.taskOverdueOnly ? 'checked' : ''} onchange="appState.taskOverdueOnly=this.checked; appState.pages.tasks=0; renderTab()" />
          Overdue Only
        </label>
      </div>
      <div class="chip-row">
        ${['ALL','ONCE','DAILY','WEEKLY','MONTHLY','YEARLY'].map(c => `<button class="chip ${appState.taskCadence===c?'active':''}" onclick="appState.taskCadence='${c}'; appState.pages.tasks=0; renderTab()">${c === 'ALL' ? 'All Cadences' : c}</button>`).join('')}
      </div>
      <table>
        <thead>
          <tr>
            ${sortableTh('tasks', 'priority', 'Priority & Cadence')}
            ${sortableTh('tasks', 'machine', 'Machine')}
            ${sortableTh('tasks', 'title', 'Task')}
            ${sortableTh('tasks', 'created', 'Created')}
            ${sortableTh('tasks', 'deadline', 'Deadline & Reminder')}
            ${sortableTh('tasks', 'pic', 'Engineers')}
            ${sortableTh('tasks', 'est', 'Est.')}
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>${tbodyHtml}</tbody>
      </table>
      ${paginationBarHtml(paged, 'tasks')}
    </div>`;
}

function toggleTaskGroupCollapse(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  appState.collapsedTaskGroups[title] = !appState.collapsedTaskGroups[title];
  renderTab();
}

function toggleTodoGroupCollapse(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  appState.collapsedTodoGroups[title] = !appState.collapsedTodoGroups[title];
  renderTab();
}

function toggleHistoryGroupCollapse(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  appState.collapsedHistoryGroups[title] = !appState.collapsedHistoryGroups[title];
  renderTab();
}

function renderTodoSubTabHtml(d) {
  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const now = Date.now();
  const completedCount = (d.todos || []).filter(td => td.isCompleted).length;
  const feed = buildTodoFeedList(d);
  const picNames = [...new Set((d.engineers || []).map(e => e.name).concat(feed.map(f => f.personInCharge)).filter(Boolean))].sort();
  const q = appState.todoSearch.trim().toLowerCase();
  const tdSort = appState.colSorts.todos || { key: 'trigger', dir: 'ASC' };

  const filtered = feed.filter(item => {
    if (!appState.todoShowDone && item.isCompleted) return false;
    if (appState.todoRepeat !== 'ALL' && item.repeatLabel !== appState.todoRepeat) return false;
    if (appState.todoPriority !== 'ALL' && item.priority !== appState.todoPriority) return false;
    if (appState.todoGroupId !== 'ALL' && String(item.groupId || '') !== String(appState.todoGroupId)) return false;
    if (appState.todoPic !== 'ALL') {
      const picLower = appState.todoPic.toLowerCase();
      const isPic = item.personInCharge.toLowerCase() === picLower;
      const isAst = parseEngineerList(item.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (q) {
      const m = item.machineId ? mMap[item.machineId] : null;
      const hay = `${item.title} ${item.notes} ${item.personInCharge} ${item.assistantEngineers} ${m?.assetCode || ''} ${m?.name || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
    switch (tdSort.key) {
      case 'title': return cmpValues(a.title, b.title, tdSort.dir);
      case 'repeat': return cmpValues(a.repeatLabel, b.repeatLabel, tdSort.dir);
      case 'priority': return cmpValues(priorityRank(a.priority), priorityRank(b.priority), tdSort.dir);
      case 'created': return cmpValues(a.createdAtMillis, b.createdAtMillis, tdSort.dir);
      case 'pic': return cmpValues(a.personInCharge, b.personInCharge, tdSort.dir);
      case 'trigger':
      default: {
        const tA = a.isCompleted ? (a.completedAtMillis || a.dueAtMillis) : a.triggerAtMillis;
        const tB = b.isCompleted ? (b.completedAtMillis || b.dueAtMillis) : b.triggerAtMillis;
        return cmpValues(tA, tB, tdSort.dir);
      }
    }
  });

  const paged = paginateWeb(filtered, 'todos');

  const ongoingItems = paged.items.filter(i => !i.isCompleted);
  const completedItems = paged.items.filter(i => i.isCompleted);

  const todoSections = [];
  if (ongoingItems.length > 0) {
    if (appState.todoGroupBy === 'NONE') {
      todoSections.push({ title: 'All Reminders', items: ongoingItems, isCompletedGroup: false });
    } else if (appState.todoGroupBy === 'SOURCE') {
      const taskRows = ongoingItems.filter(i => i.kind === 'TASK');
      const plainRows = ongoingItems.filter(i => i.kind === 'TODO');
      if (taskRows.length) todoSections.push({ title: 'From Maintenance Tasks', items: taskRows, isCompletedGroup: false });
      if (plainRows.length) todoSections.push({ title: 'Plain To-Do Reminders', items: plainRows, isCompletedGroup: false });
    } else {
      const bucket = new Map();
      ongoingItems.forEach(item => {
        const gTitle = appState.todoGroupBy === 'PRIORITY'
          ? `${item.priority || 'NORMAL'} Priority`
          : (item.personInCharge || 'Unassigned');
        if (!bucket.has(gTitle)) bucket.set(gTitle, []);
        bucket.get(gTitle).push(item);
      });
      bucket.forEach((items, title) => todoSections.push({ title, items, isCompletedGroup: false }));
    }
  }
  if (completedItems.length > 0) {
    todoSections.push({ title: 'Completed Tasks & To-Do Reminder', items: completedItems, isCompletedGroup: true });
  }

  const renderTodoRow = (item) => {
    const m = item.machineId ? mMap[item.machineId] : null;
    const g = item.groupId ? gMap[item.groupId] : null;
    const isOverdue = !item.isCompleted && item.dueAtMillis < now;
    if (item.kind === 'TASK') {
      const t = item.raw;
      return `<tr>
        <td><span class="pill pill-primary">TASK</span></td>
        <td>
          <strong>${esc(item.title)}</strong>
          <div class="muted">${m ? esc(m.assetCode) + ' · ' + esc(m.name) : ''}${g ? ' · ' + esc(g.name) : ''}${item.notes ? ' — ' + esc(item.notes) : ''}</div>
        </td>
        <td><span class="pill pill-primary">${esc(item.repeatLabel)}</span></td>
        <td>${priorityPillHtml(item.priority)}</td>
        <td><div class="muted">${fmtDate(item.createdAtMillis)}</div></td>
        <td>
          <span class="pill ${isOverdue ? 'pill-danger' : 'pill-warn'}">${isOverdue ? 'OVERDUE' : 'REMIND AT'}</span>
          <div>${fmtDate(item.triggerAtMillis)}</div>
          <div class="muted">Deadline: ${fmtDate(item.dueAtMillis)}</div>
        </td>
        <td><strong>${esc(item.personInCharge)}</strong>${item.assistantEngineers ? `<div class="muted">+ ${esc(item.assistantEngineers)}</div>` : ''}</td>
        <td>
          <div class="row" style="gap:5px;flex-wrap:nowrap;">
            <button class="icon-btn ok" title="Complete Task" aria-label="Complete Task" onclick="openCompleteTaskModal(${t.id})">${iconSvg('complete')}</button>
            <button class="icon-btn danger" title="Reject Task" aria-label="Reject Task" onclick="openRejectTaskModal(${t.id})">${iconSvg('reject')}</button>
            <button class="icon-btn" title="Edit Task" aria-label="Edit Task" onclick="openTaskModal(${t.id})">${iconSvg('edit')}</button>
          </div>
        </td>
      </tr>`;
    }
    const td = item.raw;
    return `<tr>
      <td><input type="checkbox" style="width:auto;" ${td.isCompleted?'checked':''} onchange="toggleTodo(${td.id}, this)" /></td>
      <td>
        <strong>${esc(td.title)}</strong>
        <div class="muted">${esc(td.notes)}${m ? ' · ' + esc(m.assetCode) : ''}${g ? ' · ' + esc(g.name) : ''}</div>
      </td>
      <td><span class="pill pill-primary">${esc(td.repeatRule)}</span></td>
      <td>${priorityPillHtml(td.priority)}</td>
      <td><div class="muted">${fmtDate(item.createdAtMillis)}</div></td>
      <td>
        ${td.isCompleted && td.completedAtMillis
          ? `<span class="pill pill-ok">Done ${fmtDate(td.completedAtMillis)}</span>`
          : `${isOverdue ? `<span class="pill pill-danger">OVERDUE</span> ` : ''}${fmtDate(td.dueAtMillis)}`}
      </td>
      <td>${esc(td.personInCharge)}</td>
      <td>
        <div class="row" style="gap:5px;flex-wrap:nowrap;">

        todoBodyHtml += `<tr class="group-row ${sec.isCompletedGroup ? 'completed-group' : ''}" onclick="toggleTodoGroupCollapse('${encodedKey}')">

              </div>
            </div>
          </td>
        </tr>`;
        if (!collapsed) {
          todoBodyHtml += sec.items.map(renderTodoRow).join('');

        todoBodyHtml += sec.items.map(renderTodoRow).join('');
      }
    });
  }

  return `
    <div class="filter-bar">
      <input placeholder="Search reminders, tasks, machine, PIC..." value="${esc(appState.todoSearch)}" oninput="appState.todoSearch=this.value; appState.pages.todos=0; renderTab()" />
      <select onchange="appState.todoGroupBy=this.value; renderTab()">

      <select onchange="appState.todoPriority=this.value; appState.pages.todos=0; renderTab()">
        <option value="ALL" ${appState.todoPriority==='ALL'?'selected':''}>All Priorities</option>
        <option value="URGENT" ${appState.todoPriority==='URGENT'?'selected':''}>URGENT</option>
        <option value="HIGH" ${appState.todoPriority==='HIGH'?'selected':''}>HIGH</option>
        <option value="NORMAL" ${appState.todoPriority==='NORMAL'?'selected':''}>NORMAL</option>

      <select onchange="appState.todoRepeat=this.value; appState.pages.todos=0; renderTab()">
        <option value="ALL" ${appState.todoRepeat==='ALL'?'selected':''}>All Cadences</option>

      <select onchange="appState.todoPic=this.value; appState.pages.todos=0; renderTab()">

      <select onchange="appState.todoGroupId=this.value; appState.pages.todos=0; renderTab()">
        <option value="ALL" ${appState.todoGroupId==='ALL'?'selected':''}>All Groups</option>
        ${d.groups.map(g => `<option value="${g.id}" ${String(appState.todoGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}

function renderHistorySubTabHtml(d) {
  const mMap = byIdMap(d.machines);
  const gMap = byIdMap(d.groups);
  const picNames = [...new Set((d.engineers || []).map(e => e.name).concat(d.serviceLogs.map(l => l.personInCharge)).filter(Boolean))].sort();
  const q = appState.historySearch.trim().toLowerCase();
  const hSort = appState.colSorts.history || { key: 'recorded', dir: 'DESC' };

  const filtered = d.serviceLogs.filter(l => {
    const m = mMap[l.machineId];
    const effGroupId = l.groupId || m?.groupId || null;
    if (appState.historyOutcome !== 'ALL' && l.outcome !== appState.historyOutcome) return false;
    if (appState.historyPriority !== 'ALL' && (l.prioritySnapshot || '') !== appState.historyPriority) return false;
    if (appState.historyCadence !== 'ALL' && (l.cadenceSnapshot || '') !== appState.historyCadence) return false;
    if (appState.historyGroupId !== 'ALL' && String(effGroupId || '') !== String(appState.historyGroupId)) return false;
    if (appState.historyPic !== 'ALL') {
      const picLower = appState.historyPic.toLowerCase();
      const isPic = (l.personInCharge || '').toLowerCase() === picLower;
      const isAst = parseEngineerList(l.assistantEngineers).some(a => a.toLowerCase() === picLower);
      if (!isPic && !isAst) return false;
    }
    if (q) {
      const partsHay = (l.parts || []).map(p => `${p.partCode} ${p.partName} ${p.partDescription}`).join(' ');
      const hay = `${l.summaryTitle} ${l.malfunctionDetails} ${l.rejectionReason} ${l.personInCharge} ${l.assistantEngineers || ''} ${m?.assetCode || ''} ${m?.name || ''} ${partsHay}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    const mA = mMap[a.machineId];
    const mB = mMap[b.machineId];
    switch (hSort.key) {
      case 'outcome': return cmpValues(a.outcome, b.outcome, hSort.dir);
      case 'priority': return cmpValues(priorityRank(a.prioritySnapshot), priorityRank(b.prioritySnapshot), hSort.dir);
      case 'machine': return cmpValues(`${mA?.assetCode || ''} ${mA?.name || ''}`, `${mB?.assetCode || ''} ${mB?.name || ''}`, hSort.dir);
      case 'title': return cmpValues(a.summaryTitle, b.summaryTitle, hSort.dir);
      case 'pic': return cmpValues(a.personInCharge, b.personInCharge, hSort.dir);
      case 'created': return cmpValues(a.createdAtMillis || 0, b.createdAtMillis || 0, hSort.dir);
      case 'recorded':
      default:
        return cmpValues(a.completedAtMillis || 0, b.completedAtMillis || 0, hSort.dir);
    }
  });

  const paged = paginateWeb(filtered, 'history');

  const histSections = [];
  if (appState.historyGroupBy === 'NONE') {
    histSections.push({ title: 'All History Records', logs: paged.items });
  } else {
    const bucket = new Map();
    paged.items.forEach(l => {
      const m = mMap[l.machineId];
      let gTitle = 'Ungrouped';
      if (appState.historyGroupBy === 'OUTCOME') gTitle = `${l.outcome} Jobs`;
      else if (appState.historyGroupBy === 'CADENCE') gTitle = l.cadenceSnapshot ? `${l.cadenceSnapshot} Maintenance` : 'Direct / Ad-Hoc Log';
      else if (appState.historyGroupBy === 'MACHINE') gTitle = m ? `${m.assetCode} · ${m.name}` : 'Unknown Machine';
      else if (appState.historyGroupBy === 'PIC') gTitle = l.personInCharge || 'Unassigned';
      else {
        const effGid = l.groupId || m?.groupId;
        gTitle = effGid && gMap[effGid] ? gMap[effGid].name : 'Ungrouped';
      }
      if (!bucket.has(gTitle)) bucket.set(gTitle, []);
      bucket.get(gTitle).push(l);
    });
    bucket.forEach((logs, title) => histSections.push({ title, logs }));
  }

  const renderHistRow = (l) => {
    const m = mMap[l.machineId];
    const g = gMap[l.groupId || m?.groupId];
    return `<tr>
      <td>
        ${outcomePillHtml(l.outcome)}
        ${l.cadenceSnapshot ? `<div style="margin-top:4px;"><span class="pill pill-primary">${esc(l.cadenceSnapshot)}</span></div>` : ''}
        ${g ? `<div class="muted" style="margin-top:3px;">${esc(g.name)}</div>` : ''}
      </td>
      <td>${l.prioritySnapshot ? priorityPillHtml(l.prioritySnapshot) : '<span class="muted">-</span>'}</td>
      <td><strong>${esc(m?.assetCode || '-')}</strong><div class="muted">${esc(m?.name || '')}</div></td>
      <td>
        <strong>${esc(l.summaryTitle)}</strong>
        ${l.outcome === 'REJECTED' && l.rejectionReason ? `<div style="color:var(--danger);font-size:12px;margin-top:3px;">Rejection reason: ${esc(l.rejectionReason)}</div>` : ''}
        ${l.malfunctionDetails ? `<div class="muted" style="margin-top:3px;">${esc(l.malfunctionDetails)}</div>` : ''}
        ${l.parts.length ? `<div style="margin-top:5px;">${l.parts.map(p => `<span class="pill pill-primary" style="margin-right:4px;">${esc(p.partCode)} ${esc(p.partName)} ×${p.quantity} ${esc(p.unit)}</span>`).join('')}</div>` : ''}
      </td>
      <td>
        <strong>${esc(l.personInCharge)}</strong>
        ${l.assistantEngineers ? `<div class="muted">+ ${esc(l.assistantEngineers)}</div>` : ''}
      </td>
      <td><div class="muted">${fmtDate(l.createdAtMillis)}</div></td>
      <td><div>${fmtDate(l.completedAtMillis)}</div><div class="muted">${l.serviceDurationMinutes > 0 ? l.serviceDurationMinutes + 'm' : 'Rejected'}</div></td>
      <td><button class="icon-btn danger" title="Delete History Entry" aria-label="Delete History Entry" onclick="deleteHistoryLog(${l.id}, this)">${iconSvg('del')}</button></td>
    </tr>`;
  };

  let histBodyHtml = '';
  if (filtered.length === 0) {
    histBodyHtml = `<tr><td colspan="8" class="muted">No historical records match the filter.</td></tr>`;
  } else {
    histSections.forEach(sec => {
      if (appState.historyGroupBy !== 'NONE') {
        const collapsed = Boolean(appState.collapsedHistoryGroups[sec.title]);
        const secRej = sec.logs.filter(l => l.outcome === 'REJECTED').length;
        const encodedKey = encodeURIComponent(sec.title);
        histBodyHtml += `<tr class="group-row" onclick="toggleHistoryGroupCollapse('${encodedKey}')">
          <td colspan="8">
            <div class="between">
              <span>${collapsed ? '▶' : '▼'} ${esc(sec.title)}</span>
              <div class="row">
                ${secRej > 0 ? `<span class="pill pill-danger">${secRej} REJECTED</span>` : ''}
                <span class="pill">${sec.logs.length}</span>
              </div>
            </div>
          </td>
        </tr>`;
        if (!collapsed) {
          histBodyHtml += sec.logs.map(renderHistRow).join('');
        }
      } else {
        histBodyHtml += sec.logs.map(renderHistRow).join('');
      }
    });
  }

  return `
    <div class="filter-bar">
      <input placeholder="Search completed/rejected task, engineer, part..." value="${esc(appState.historySearch)}" oninput="appState.historySearch=this.value; appState.pages.history=0; renderTab()" />
      <select onchange="appState.historyGroupBy=this.value; renderTab()">
        <option value="CUSTOM_GROUP" ${appState.historyGroupBy==='CUSTOM_GROUP'?'selected':''}>Group: Custom Group</option>
        <option value="OUTCOME" ${appState.historyGroupBy==='OUTCOME'?'selected':''}>Group: Outcome</option>
        <option value="CADENCE" ${appState.historyGroupBy==='CADENCE'?'selected':''}>Group: Cadence</option>
        <option value="MACHINE" ${appState.historyGroupBy==='MACHINE'?'selected':''}>Group: Machine</option>
        <option value="PIC" ${appState.historyGroupBy==='PIC'?'selected':''}>Group: Engineer</option>
        <option value="NONE" ${appState.historyGroupBy==='NONE'?'selected':''}>Flat List</option>
      </select>
      <select onchange="appState.historyPriority=this.value; appState.pages.history=0; renderTab()">
        <option value="ALL" ${appState.historyPriority==='ALL'?'selected':''}>All Priorities</option>
        <option value="URGENT" ${appState.historyPriority==='URGENT'?'selected':''}>URGENT</option>
        <option value="HIGH" ${appState.historyPriority==='HIGH'?'selected':''}>HIGH</option>
        <option value="NORMAL" ${appState.historyPriority==='NORMAL'?'selected':''}>NORMAL</option>
      </select>
      <select onchange="appState.historyCadence=this.value; appState.pages.history=0; renderTab()">
        <option value="ALL" ${appState.historyCadence==='ALL'?'selected':''}>All Cadences</option>
        ${['ONCE','DAILY','WEEKLY','MONTHLY','YEARLY'].map(c => `<option value="${c}" ${appState.historyCadence===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select onchange="appState.historyPic=this.value; appState.pages.history=0; renderTab()">
        <option value="ALL" ${appState.historyPic==='ALL'?'selected':''}>All Engineers</option>
        ${picNames.map(p => `<option value="${esc(p)}" ${appState.historyPic===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>
      <select onchange="appState.historyGroupId=this.value; appState.pages.history=0; renderTab()">
        <option value="ALL" ${appState.historyGroupId==='ALL'?'selected':''}>All Groups</option>
        ${d.groups.map(g => `<option value="${g.id}" ${String(appState.historyGroupId)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
      </select>
      <select onchange="appState.historyOutcome=this.value; appState.pages.history=0; renderTab()">
        <option value="ALL" ${appState.historyOutcome==='ALL'?'selected':''}>All Outcomes</option>
        <option value="DONE" ${appState.historyOutcome==='DONE'?'selected':''}>DONE</option>
        <option value="REJECTED" ${appState.historyOutcome==='REJECTED'?'selected':''}>REJECTED</option>
      </select>
    </div>
    <div class="chip-row">
      ${['ALL','DONE','REJECTED'].map(o => `<button class="chip ${appState.historyOutcome===o?'active':''}" onclick="appState.historyOutcome='${o}'; appState.pages.history=0; renderTab()">${o === 'ALL' ? 'All Outcomes' : o}</button>`).join('')}
    </div>
    <table>
      <thead>
        <tr>
          ${sortableTh('history', 'outcome', 'Outcome & Cadence')}
          ${sortableTh('history', 'priority', 'Priority')}
          ${sortableTh('history', 'machine', 'Machine')}
          ${sortableTh('history', 'title', 'Task & Details / Parts')}
          ${sortableTh('history', 'pic', 'Engineers')}
          ${sortableTh('history', 'created', 'Created')}
          ${sortableTh('history', 'recorded', 'Recorded')}
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>${histBodyHtml}</tbody>
    </table>
    ${paginationBarHtml(paged, 'history')}`;
}

async function deleteHistoryLog(id, btnEl) {
  if (!confirm('Delete this history log entry?')) return;
  await withBusy('Deleting...', async () => {
    await apiJson(`/api/logs/${id}`, 'DELETE');
    showToast('History entry deleted');
    await refreshState(true);
  }, btnEl);
}

function syncTaskMachineStatus() {
  const mId = Number(document.getElementById('t-machine')?.value);
  const m = (appState.data?.machines || []).find(x => x.id === mId);
  const stEl = document.getElementById('t-machine-status');
  if (m && stEl) stEl.value = m.status || 'OPERATIONAL';
}

function renderMachinePickerBlock(prefix, machines, selectedId, allowNone = false, onSelectCallbackJs = '') {
  const sel = selectedId ? (machines || []).find(m => m.id === Number(selectedId)) : null;
  const labelText = sel ? `${sel.assetCode} · ${sel.name}` : (allowNone ? 'None (General Reminder)' : 'Select Machine *');
  return `
    <div>
      <input type="hidden" id="${prefix}-machine" value="${sel ? sel.id : ''}" />
      <div class="between" style="margin-bottom:4px;">
        <span class="pill pill-primary" id="${prefix}-machine-selected-badge">${esc(labelText)}</span>
        ${allowNone && sel ? `<button type="button" class="btn-sm" onclick="selectPickerMachine('${prefix}', '', '${esc(onSelectCallbackJs)}')">Clear</button>` : ''}
      </div>
      <input id="${prefix}-machine-search" placeholder="Search machine ID, name, zone, or description..." oninput="filterMachinePickerList('${prefix}', ${allowNone}, '${esc(onSelectCallbackJs)}')" style="margin-bottom:6px;" />
      <div class="picker-list" id="${prefix}-machine-results" style="max-height:150px;"></div>
    </div>`;
}

function selectPickerMachine(prefix, machineId, onSelectCallbackJs = '') {
  const hiddenEl = document.getElementById(`${prefix}-machine`);
  if (hiddenEl) hiddenEl.value = machineId ? String(machineId) : '';
  const m = machineId ? (appState.data?.machines || []).find(x => x.id === Number(machineId)) : null;
  const badge = document.getElementById(`${prefix}-machine-selected-badge`);
  if (badge) badge.textContent = m ? `${m.assetCode} · ${m.name}` : 'None (General Reminder)';
  const allowNone = Boolean(document.getElementById(`${prefix}-machine-results`)?.dataset.allowNone === 'true');
  filterMachinePickerList(prefix, allowNone, onSelectCallbackJs);
  if (onSelectCallbackJs === 'syncTaskMachineStatus') syncTaskMachineStatus();
}

function filterMachinePickerList(prefix, allowNone = false, onSelectCallbackJs = '') {
  const el = document.getElementById(`${prefix}-machine-results`);
  if (!el) return;
  el.dataset.allowNone = allowNone ? 'true' : 'false';
  const curId = document.getElementById(`${prefix}-machine`)?.value || '';
  const rawQ = (document.getElementById(`${prefix}-machine-search`)?.value || '').trim().toLowerCase();
  const tokens = rawQ.split(/\s+/).filter(Boolean);
  const machines = appState.data?.machines || [];
  const matched = machines.filter(m => {
    if (!tokens.length) return true;
    const hay = `${m.assetCode} ${m.name} ${m.locationZone} ${m.modelInfo} ${m.notes || ''}`.toLowerCase();
    return tokens.every(tok => hay.includes(tok));
  });
  let html = '';
  if (allowNone && !tokens.length) {
    html += `<div class="picker-item ${curId === '' ? 'selected' : ''}" onclick="selectPickerMachine('${prefix}', '', '${esc(onSelectCallbackJs)}')">
      <div><strong>None (General Reminder)</strong></div>
      <span class="pill">Optional</span>
    </div>`;
  }
  html += matched.slice(0, 60).map(m => `
    <div class="picker-item ${String(m.id) === String(curId) ? 'selected' : ''}" onclick="selectPickerMachine('${prefix}', '${m.id}', '${esc(onSelectCallbackJs)}')">
      <div>
        <span class="pill pill-primary">${esc(m.assetCode)}</span>
        <strong>${esc(m.name)}</strong>
        <div class="muted">${esc([m.locationZone, m.modelInfo].filter(Boolean).join(' · '))}</div>
      </div>
      ${statusPillHtml(m.status)}
    </div>
  `).join('') || `<div class="muted" style="padding:8px;">No matching machines found.</div>`;
  el.innerHTML = html;
}
